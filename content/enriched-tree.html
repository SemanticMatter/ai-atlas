":"Academic mirror of the published Science paper; explains echo-state networks and cites Jaeger's original 2001 technical report."},{"title":"snnTorch: spiking neural network tutorials","url":"https://snntorch.readthedocs.io/en/latest/tutorials/index.html","kind":"documentation"},{"title":"A quick start to ReservoirPy","url":"https://reservoirpy.readthedocs.io/en/latest/user_guide/quickstart.html","kind":"documentation"}],"related":["topic-021","topic-023","topic-055"],"plain":"Spiking networks: pass timed pulses, like simplified nerve signals.\nReservoir networks: feed changing signals through a mostly fixed network, then learn to read its response.\nThink of reading ripples after drops hit water.\nThese methods handle streams such as sound, but energy savings depend on the hardware.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Neural architectures and deep learning"],"facet":1},{"name":"Autoregressive models","detail":"Generate by conditioning each element on earlier elements; not limited to text or transformers.","source":null,"id":"topic-027","context":"An autoregressive model factorises a joint prediction into a sequence of conditional predictions. Each generated element depends on earlier elements in a chosen ordering. The elements can be words, audio samples, image pixels or other structured values. This provides a direct way to train on known sequences and generate new ones incrementally. Different architectures, including recurrent, convolutional and attention-based networks, can implement the same formulation. It is useful when ordered generation fits the task, but the ordering and generation strategy influence how errors accumulate and which constraints are easy to satisfy.","example":"An illustrative assistant generates a maintenance summary token by token, conditioning each step on the source context and text already produced. In another application, the same modelling principle generates successive signal values rather than language, demonstrating that autoregression is broader than an LLM architecture.","limitation":"Sequential dependencies can limit generation speed, and early mistakes can influence later outputs. Likely continuations need not be true, useful or globally consistent; generation requires task-specific evaluation and appropriate constraints.","refs":[{"title":"Pixel Recurrent Neural Networks","url":"https://arxiv.org/abs/1601.06759","kind":"paper"}],"related":["topic-022","topic-033","topic-056"],"plain":"These models generate one item using earlier items, like continuing a sentence one piece at a time. This approach works for text, sound and other ordered data. Early mistakes can affect what comes next.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Generative formulations — can share architectures"],"facet":1},{"name":"Variational autoencoders / VAEs","detail":"Latent-variable generation trained with variational inference.","source":"vae","id":"topic-028","context":"A variational autoencoder learns a probabilistic latent representation and a decoder that maps latent samples back to data. Training balances reconstruction with a regularisation term that relates the inferred latent distribution to a chosen prior. This makes it possible to generate new examples and inspect a compressed representation of the data. VAEs are useful for representation learning, generative modelling and building latent components within larger systems. The latent variables are learned statistical factors; without additional structure or supervision, they need not correspond to distinct concepts that a person can readily name.","example":"An illustrative process-monitoring model compresses normal operating traces into a latent space and reconstructs them. Engineers inspect unusual reconstruction patterns as one signal for investigation, comparing them with real faults rather than assuming that every poor reconstruction represents a dangerous event.","limitation":"Reconstruction quality and useful latent structure can trade off, and training may leave some latent dimensions unused. Reconstruction error alone is not a calibrated anomaly probability or a guarantee of meaningful underlying factors.","refs":[{"title":"Auto-Encoding Variational Bayes","url":"https://arxiv.org/abs/1312.6114","kind":"paper"}],"related":["topic-015","topic-030","topic-032","topic-029","topic-086"],"plain":"A VAE learns short, flexible codes for examples, like compact descriptions of faces. It can use these codes to create new images or other data. The codes may not match ideas people recognise.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Generative formulations — can share architectures"],"facet":1},{"name":"Generative adversarial networks / GANs","detail":"Train a generator against a discriminator.","source":"gan","id":"topic-029","context":"A generative adversarial network trains a generator and a discriminator in competition. The generator produces samples, while the discriminator learns to distinguish generated samples from training examples. Their interaction supplies a learning signal without requiring the generator to explicitly evaluate a normalized likelihood for every sample. GANs are useful for image synthesis, translation and other generative tasks where convincing samples matter. The adversarial training setup is the defining feature; many different neural architectures can be used inside it. Evaluation must consider diversity and task relevance as well as how realistic individual outputs appear.","example":"An illustrative vision team uses a GAN to create variations of surface textures for a controlled research experiment. They compare the generated variation with real data and measure whether using it helps a detector on an untouched test set from a different acquisition session.","limitation":"Training can be unstable, and a generator may collapse to a narrow set of outputs. Visually convincing samples can omit rare but important cases, so realism alone is an insufficient measure of usefulness.","refs":[{"title":"Generative Adversarial Networks","url":"https://arxiv.org/abs/1406.2661","kind":"paper"}],"related":["topic-028","topic-030","topic-037"],"plain":"A GAN trains two models in competition: one creates examples, and the other tries to spot generated ones. This can produce new images that resemble the training examples. Convincing pictures can still lack variety.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Generative formulations — can share architectures"],"facet":1},{"name":"Diffusion and score-based models","detail":"Generate through learned reversal of a corruption/noising process.","source":"diffusion","id":"topic-030","context":"Diffusion models learn to reverse a process that progressively corrupts data. Generation begins from noise or another corrupted state and applies learned refinement steps. Score-based formulations describe related methods through estimates of how probability density changes around a point. These approaches are useful for images, audio, video and other distributions where iterative refinement can represent complex variation. Conditioning can guide the output towards text, measurements or partial observations. The denoising objective is separate from the network architecture, so convolutional, transformer and other backbones can implement parts of a diffusion system.","example":"An illustrative reconstruction tool starts from an incomplete sensor image and generates plausible completions conditioned on the observed region. Researchers compare those completions with known targets and retain uncertainty across alternatives, rather than treating one realistic-looking reconstruction as a new measurement of reality.","limitation":"Sampling may require many refinement steps, and plausible output is not evidence that a reconstructed detail existed. Guidance, training coverage and evaluation conditions strongly affect reliability, diversity and computational cost.","refs":[{"title":"Deep Unsupervised Learning using Nonequilibrium Thermodynamics","authors":"Jascha Sohl-Dickstein, Eric Weiss, Niru Maheswaranathan and Surya Ganguli","year":2015,"kind":"paper","url":"https://proceedings.mlr.press/v37/sohl-dickstein15.html"},{"title":"Generative Modeling by Estimating Gradients of the Data Distribution","authors":"Yang Song and Stefano Ermon","year":2019,"kind":"paper","url":"https://arxiv.org/abs/1907.05600"},{"title":"Score-Based Generative Modeling through Stochastic Differential Equations","authors":"Yang Song, Jascha Sohl-Dickstein, Diederik P. Kingma, Abhishek Kumar, Stefano Ermon and Ben Poole","year":2021,"kind":"paper","url":"https://arxiv.org/abs/2011.13456"},{"title":"Denoising Diffusion Probabilistic Models","url":"https://arxiv.org/abs/2006.11239","kind":"paper"}],"related":["topic-028","topic-031","topic-033","topic-029"],"plain":"Diffusion models learn to remove added noise, like clearing static from a picture. Score-based models learn which way to push each noisy sample. Both can create pictures or sound, but plausible details may be invented.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Generative formulations — can share architectures"],"facet":1},{"name":"Normalizing flows and flow matching","detail":"Learn transformations or vector fields transporting a base distribution towards data.","source":"flow","id":"topic-031","context":"Normalizing flows build transformations between a simple probability distribution and a data distribution, often using invertible mappings that support likelihood evaluation. Continuous flows describe the transformation through a differential equation. Flow matching trains an appropriate vector field along chosen probability paths, connecting this family to some diffusion formulations without making the terms interchangeable. These methods are useful for generative modelling, density estimation and constructing controllable sample transformations. The path, numerical solver and architecture affect the trade-off between training complexity, sampling cost and output quality in an implemented system.","example":"An illustrative generative model transforms samples from a simple distribution into structured engineering signals. The team varies the number of numerical integration steps and measures both fidelity and runtime, checking whether the generated traces preserve properties required by their downstream simulation study.","limitation":"Convenient probability paths or invertibility requirements can constrain modelling choices. Solver accuracy and sampling cost matter in practice, and a flow-matching objective does not by itself guarantee faster or more faithful generation for every task.","refs":[{"title":"Flow Matching for Generative Modeling","url":"https://arxiv.org/abs/2210.02747","kind":"paper"}],"related":["topic-028","topic-030","topic-032"],"plain":"Normalizing flows: learn a reversible recipe that turns simple random data into more complex data.\nFlow matching: learns which way to move the data at each stage of a chosen path.\nBoth can create pictures, but may need many calculation steps.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Generative formulations — can share architectures"],"facet":1},{"name":"Energy-based models","detail":"Assign an energy to configurations, with inference or sampling favouring lower-energy states.","source":null,"id":"topic-032","context":"An energy-based model assigns a scalar compatibility score to a configuration, with lower energy representing more compatible or preferred states under the model. Prediction can then require finding a low-energy configuration, and probabilistic variants relate energy to an unnormalised distribution. This framework is useful for structured prediction and learning relationships among variables without specifying a simple one-pass generator. It connects representation learning with an inference problem: learning a useful energy function and efficiently searching or sampling from it are separate challenges that must both be addressed for a working application.","example":"An illustrative structured predictor scores possible combinations of component states, favouring configurations that fit the observations and learned relationships. An inference procedure searches for a low-energy combination, which engineers compare with known cases and explicit physical constraints before using it in a decision.","limitation":"Low energy reflects the learned scoring rule, not necessarily physical energy or correctness. Inference and sampling can be difficult, and poorly chosen training negatives may leave undesirable configurations with deceptively favourable scores.","refs":[{"title":"A Tutorial on Energy-Based Learning","url":"https://cs.nyu.edu/~yann/2010f-G22-2565-001/diglib/lecun-06.pdf","kind":"paper"}],"related":["topic-008","topic-016","topic-030"],"plain":"An energy-based model gives possible answers penalty scores, then looks for lower-scoring answers. Like comparing candidate puzzle solutions, this helps choose answers whose parts fit together. Low scores do not prove an answer is correct.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Generative formulations — can share architectures"],"facet":1},{"name":"Diffusion language models","detail":"Iterative token denoising is an alternative to strictly left-to-right language generation.","source":"llada","id":"topic-033","context":"Diffusion language models generate text through iterative prediction and refinement of corrupted or masked tokens. Unlike a strictly left-to-right formulation, the procedure can consider and revise multiple positions within a sequence. A transformer may still provide the underlying network, so this is a change in generative formulation rather than a necessary rejection of attention. The approach is an active research direction for parallel generation, text editing and alternative inference strategies. Its value depends on the complete training and sampling procedure, including how many refinement steps are needed to reach the required quality.","example":"An illustrative editing task provides a paragraph with several missing spans. A diffusion language model repeatedly fills and refines the missing tokens using context on both sides, while evaluators compare factual consistency, constraint satisfaction and runtime against an autoregressive editing baseline on identical examples.","limitation":"Parallel refinement does not automatically reduce end-to-end latency. Quality, sequence length and number of denoising steps interact, and benchmark success does not establish reliable factual grounding or superiority across language tasks.","refs":[{"title":"Large Language Diffusion Models","url":"https://arxiv.org/abs/2502.09992","kind":"paper"}],"related":["topic-022","topic-027","topic-030"],"plain":"These models build text by repeatedly filling gaps or revising several positions, like working through a sentence draft. They offer another way to generate or edit text. Repeated revisions can still take time.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Generative formulations — can share architectures"],"facet":1},{"id":"topic-087","name":"State estimation: Kalman and particle filters","detail":"Infer a changing hidden state from noisy measurements and a dynamics model; a classical foundation adjacent to AI.","context":"State estimation infers quantities that sensors cannot measure perfectly, such as position, velocity or an internal process condition. A filter predicts the next state using a dynamics model, then updates that prediction using new observations. The Kalman filter tracks a mean and covariance; for a correctly specified linear Gaussian model, it gives the exact posterior. Particle filters approximate more general posterior distributions with weighted samples. These methods come from estimation and control, and do not inherently learn from training data. They are useful components of robotics and AI systems that must act despite noisy, incomplete or delayed observations.","example":"A warehouse robot combines wheel motion with intermittent position measurements. Its estimator predicts where the robot has moved, corrects that prediction when a measurement arrives, and reports uncertainty. A planner can then slow the robot when its location becomes insufficiently certain.","limitation":"A filter cannot recover information that the sensors and model do not make observable. Incorrect dynamics or noise assumptions can produce misleading confidence; particle filters can also need many samples in difficult, high-dimensional problems.","refs":[{"title":"A New Approach to Linear Filtering and Prediction Problems","url":"https://people.duke.edu/~hpgavin/SystemID/References/Kalman-JBE-1960.pdf","kind":"paper"},{"title":"A Tutorial on Particle Filtering and Smoothing: Fifteen years later","url":"https://www.stats.ox.ac.uk/~doucet/doucet_johansen_tutorialPF2011.pdf","kind":"paper"}],"related":["topic-016","topic-059","topic-076","topic-088"],"plain":"These methods blend a forecast with fresh readings, like checking a map against road signs. A robot can use them to track its position despite noisy sensors. A poor model can still misplace it.","path":["1 · Computational methods — what performs the computation?","State estimation and control — adjacent foundations"],"facet":1},{"id":"topic-088","name":"Optimal control and model predictive control","detail":"Optimize actions through a dynamics model and constraints; MPC repeatedly replans over a moving horizon.","context":"Optimal control chooses actions to minimize a specified cost while respecting a system's dynamics and constraints. Model predictive control repeatedly solves a finite-horizon optimization problem, applies its first action, measures the new situation and plans again. This feedback makes it practical to respond to disturbances rather than execute an entire forecast blindly. Models can come from physics, identification or machine learning. These are established control methods adjacent to AI, not inherently neural or learning based. They are useful when actions have delayed effects and constraints matter, including process plants, building energy management and robot motion.","example":"A building controller forecasts indoor temperature under several heating schedules, electricity prices and weather conditions. It chooses a schedule that trades energy cost against comfort limits, applies the next setting, and recomputes after new measurements reveal occupancy or weather changes.","limitation":"An optimizer only optimizes the model and objective it receives. Model error, infeasible constraints and computation deadlines matter; stability or constraint guarantees require specific assumptions and design choices, not merely the use of MPC.","refs":[{"title":"Model Predictive Control: Theory, Computation, and Design, 2nd edition","url":"https://sites.engineering.ucsb.edu/~jbraw/mpc/","kind":"textbook"}],"related":["topic-008","topic-009","topic-076","topic-087","topic-039"],"plain":"These methods plan actions with a model, such as choosing when to heat a building. Model predictive control measures what happened and plans again. Use it to balance goals and limits, but model errors can spoil the plan.","path":["1 · Computational methods — what performs the computation?","State estimation and control — adjacent foundations"],"facet":1},{"name":"Supervised learning","detail":"Learn from externally supplied target labels or values.","source":"ml","id":"topic-034","context":"Supervised learning fits a mapping from inputs to supplied targets. Classification predicts categories, while regression predicts numerical values, but both rely on examples of the desired relationship. The targets may come from annotation, measurements or operational records. This paradigm can train many architectures, including linear models, trees and neural networks. It is useful when representative labelled data exist and the desired output is reasonably well defined. Good practice separates model fitting from evaluation and chooses splits that reflect future use, such as new time periods, sites or machines rather than random near-duplicates.","example":"An illustrative inspection dataset pairs component images with reviewed defect labels. A model learns from one set of examples and is evaluated on later inspections from different assets, allowing the team to estimate how well the learned mapping transfers to its intended operating environment.","limitation":"Labels may be noisy, biased or inconsistently defined. A model can exploit data leakage or irrelevant shortcuts, so a high test score is meaningful only when the test design matches the actual deployment question.","refs":[{"title":"Supervised learning","url":"https://scikit-learn.org/stable/supervised_learning.html","kind":"documentation"}],"related":["topic-012","topic-013","topic-037"],"plain":"A model learns from examples with supplied answers, like photos labelled 'cat' or 'dog'. Use it to sort new photos or predict a number, such as a house price. Wrong labels can teach the wrong pattern.","path":["2 · Learning and adaptation — how does behaviour improve?","Learning signals"],"facet":2},{"name":"Unsupervised learning","detail":"Discover structure or model distributions without externally supplied task labels.","source":"ml","id":"topic-035","context":"Unsupervised learning seeks structure in data without externally supplied labels for a particular prediction task. It includes clustering, density estimation and representation-learning approaches. The objective still imposes a preference: compact clusters, good reconstruction or a suitable statistical model are different goals. These methods are useful for exploration, compression and building features when labelling is difficult. They can reveal patterns worth investigating, but interpreting a pattern requires domain context. The absence of labels does not make an analysis assumption-free, and the structure found may reflect measurement processes rather than meaningful behaviour.","example":"An illustrative team analyses unlabelled process logs to identify recurring operating patterns. They use clusters and visualisations to guide interviews with operators, then check whether the patterns correspond to known activities, sensor changes or preprocessing artefacts before assigning practical significance to them.","limitation":"Without task labels, it can be difficult to define success objectively. Attractive clusters or embeddings may be unstable or irrelevant, and downstream utility should be checked with independent evidence rather than visual intuition alone.","refs":[{"title":"Unsupervised learning","url":"https://scikit-learn.org/stable/unsupervised_learning.html","kind":"documentation"}],"related":["topic-015","topic-028","topic-037","topic-086"],"plain":"A model looks for patterns without supplied answers, like grouping similar shop orders. Use it to explore a large collection or describe it with fewer numbers. Interesting patterns may not be useful.","path":["2 · Learning and adaptation — how does behaviour improve?","Learning signals"],"facet":2},{"name":"Semi-supervised learning","detail":"Combine labelled and unlabelled examples; pseudo-labelling is one possible method.","source":"ml","id":"topic-036","context":"Semi-supervised learning combines a limited labelled dataset with additional unlabelled examples. Methods may propagate labels through similarity relationships, encourage consistent predictions under perturbations, or use confident predictions as provisional labels. This can help when annotation is expensive but unlabelled data are abundant. The expected benefit depends on the relationship between labelled and unlabelled distributions and on whether the method's assumptions fit the task. It is distinct from self-supervision: semi-supervised learning explicitly uses some externally supplied task labels, while self-supervised objectives derive their training targets from the data itself.","example":"An illustrative quality-control team has reviewed a small set of defect images and collected many unlabelled production images. A semi-supervised method uses both sources, while a separate manually reviewed test set checks whether the additional data improve detection of genuinely important defect types.","limitation":"Incorrect pseudo-labels can reinforce themselves, particularly for rare classes or shifted data. Extra unlabelled examples may hurt if they violate the method's assumptions, so compare with a supervised-only baseline and retain independent evaluation.","refs":[{"title":"Semi-supervised learning","url":"https://scikit-learn.org/stable/modules/semi_supervised.html","kind":"documentation"}],"related":["topic-034","topic-035","topic-037"],"plain":"Semi-supervised learning combines examples with known answers and examples without them. That can help when labelling a large image collection is costly. Some methods can reinforce their own mistaken labels.","path":["2 · Learning and adaptation — how does behaviour improve?","Learning signals"],"facet":2},{"name":"Self-supervised learning","detail":"Derive prediction targets from the data itself, such as masked content, next tokens or paired views.","source":"foundation","id":"topic-037","context":"Self-supervised learning creates training targets from the structure of the data. A model might predict masked content, the next token, a future representation, or whether two transformed observations correspond. This enables learning from large collections that lack manually annotated task labels. The resulting representation can then be adapted to a downstream task with fewer labels or different objectives. It is useful when raw data are plentiful, but its success depends on which information the pretraining task encourages the model to retain. The chosen augmentations and prediction targets are substantive modelling decisions.","example":"An illustrative sensor model learns to predict withheld segments of historical time series before being adapted to fault classification. A vision model might instead compare transformed views of the same image, learning representations that can later support inspection with a smaller reviewed dataset.","limitation":"A useful pretraining objective does not guarantee useful downstream features. Augmentations can remove task-critical information, and large unlabelled datasets can contain leakage, bias or distributions that differ substantially from the intended application.","refs":[{"title":"A Simple Framework for Contrastive Learning of Visual Representations","url":"https://arxiv.org/abs/2002.05709","kind":"paper"}],"related":["topic-034","topic-036","topic-053"],"plain":"Self-supervised learning creates practice tasks from the data, such as guessing a hidden word. This uses large collections without people supplying an answer for every training example. The practice task may miss what later tasks need.","path":["2 · Learning and adaptation — how does behaviour improve?","Learning signals"],"facet":2},{"name":"Imitation learning","detail":"Learn behaviour from demonstrations; includes behavioural cloning and interactive variants.","source":"rl","id":"topic-038","context":"Imitation learning trains behaviour from demonstrations rather than relying only on trial-and-error rewards. Behavioural cloning treats demonstrated actions as supervised targets. Other approaches collect corrective demonstrations or infer what outcomes the demonstrator appears to prefer. This is useful when expert behaviour is available and exploratory interaction is expensive, slow or inappropriate. A central difficulty is distribution shift: small policy errors can lead to situations that the expert demonstrations never covered. Effective systems therefore consider how demonstrations are collected, what state information is visible, and how the learner can recover after mistakes.","example":"An illustrative manipulation policy learns from recorded demonstrations of placing parts in a fixture. During controlled evaluation, an expert labels additional situations where the learner drifts off course, so the training set includes recovery behaviour as well as ideal successful sequences.","limitation":"Demonstrations can encode suboptimal habits or omit rare failures. Copying observed actions does not reveal the expert's full reasoning, and a policy may fail when its own errors move it outside the demonstrated conditions.","refs":[{"title":"A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning","url":"https://arxiv.org/abs/1011.0686","kind":"paper"}],"related":["topic-034","topic-039","topic-059"],"plain":"A model learns from demonstrations, like a robot copying steps shown by a person. Use it when examples are available and trying random actions would be costly. The examples may leave out unusual situations.","path":["2 · Learning and adaptation — how does behaviour improve?","Learning signals"],"facet":2},{"name":"Model-free ↔ model-based","detail":"Whether learning/planning uses an explicit environment dynamics model.","source":"rl","id":"topic-039","context":"The model-free versus model-based distinction concerns the use of an environment dynamics model. Model-free methods learn action values or policies without explicitly planning through such a model. Model-based methods use known or learned transitions, rewards or decision-relevant latent dynamics to evaluate future possibilities. These are design choices rather than a ranking of intelligence. Planning can reduce the need for real interactions, while direct policy learning can avoid some modelling errors and inference overhead. Hybrid systems may use simulated experience during training and a fast learned policy during execution, combining elements of both approaches.","example":"An illustrative robot can learn a policy directly from interaction records, or learn a predictive model and use it to compare candidate action sequences. The team measures real-world task success and sample requirements, including whether errors in the learned dynamics mislead the planner.","limitation":"A planner can exploit inaccuracies in a learned model and choose actions that look good only in simulation. Model-free learning can instead require many interactions; neither label determines reliability without task-specific evidence.","refs":[{"title":"Mastering Atari, Go, Chess and Shogi by Planning with a Learned Model","url":"https://arxiv.org/abs/1911.08265","kind":"paper"}],"related":["topic-007","topic-040","topic-060","topic-088"],"plain":"Reinforcement learning uses rewards to guide choices.\nModel-free: learns choices without an explicit model of how the surroundings change.\nModel-based: uses such a model to consider possible outcomes.\nBoth can guide a robot toward a goal.\nFaulty world predictions can produce poor plans.","path":["2 · Learning and adaptation — how does behaviour improve?","Reinforcement learning — several independent axes"],"facet":2},{"name":"Value-based ↔ policy-based ↔ actor–critic","detail":"How action values and/or the action-selection policy are represented and optimized.","source":"rl","id":"topic-040","context":"Value-based methods learn estimates of how good states or actions are under a reward objective, then use those estimates to choose actions. Policy-based methods optimise a parameterised action-selection rule directly. Actor–critic methods combine a policy, the actor, with an estimator that helps evaluate or improve it, the critic. These choices interact with whether the environment is modelled and how experience is collected. They are useful ways to organise RL algorithms, but real systems often mix components. The practical choice depends on action space, feedback quality, stability and interaction constraints.","example":"An illustrative controller with a few discrete actions can compare estimated action values. A controller with continuous actuator settings may optimise a continuous policy and use a critic to guide updates, with both approaches evaluated against the same reward definition and operational constraints.","limitation":"A critic can provide a biased learning signal, while policy optimisation may have high variance or unstable updates. Optimising a reward does not guarantee that the reward captures all operational requirements or failure modes.","refs":[{"title":"Kinds of reinforcement learning algorithms","url":"https://spinningup.openai.com/en/latest/spinningup/rl_intro2.html","kind":"documentation"}],"related":["topic-039","topic-041","topic-046"],"plain":"Reinforcement learning uses rewards to guide choices.\nValue-based: estimates rewards over time for each choice.\nPolicy-based: learns a choice rule directly.\nActor–critic: combines a choice rule with estimates of how well it works.\nAll can help choose a robot's next move.\nA misleading reward can teach the wrong behaviour.","path":["2 · Learning and adaptation — how does behaviour improve?","Reinforcement learning — several independent axes"],"facet":2},{"name":"Online ↔ offline; on-policy ↔ off-policy","detail":"Data collection and policy relationships are separate choices, not one exclusive hierarchy.","source":"rl","id":"topic-041","context":"Online and offline RL describe how experience is obtained. Online learning can collect new interactions as the policy changes; offline learning works from a fixed dataset. On-policy and off-policy describe a different relationship: whether updates use experience from the policy being optimised or can learn from other behaviour policies. These axes should not be collapsed into a single hierarchy. They are useful for understanding what evidence an algorithm needs and which deployment constraints it can respect. Reusing operational logs is attractive, but the recorded actions determine which alternatives the learner can evaluate credibly.","example":"An illustrative plant controller is first studied using a fixed archive of historical actions and outcomes. Researchers identify states and actions poorly represented in that archive, then decide whether carefully bounded new data collection is needed before evaluating a revised policy in practice.","limitation":"Offline data may not cover the actions a new policy would choose. Extrapolation errors and confounding can make estimated improvements unreliable; online exploration also introduces costs and constraints that a benchmark may not reflect.","refs":[{"title":"Offline Reinforcement Learning: Tutorial, Review, and Perspectives on Open Problems","url":"https://arxiv.org/abs/2005.01643","kind":"paper"}],"related":["topic-038","topic-039","topic-040"],"plain":"Reinforcement learning uses rewards to guide choices.\nOnline: keeps gathering fresh experience.\nOffline: uses a fixed logbook of past attempts.\nSeparately, on-policy: learns from choices made with its current rule.\nOff-policy: can also learn from choices made with other rules.\nThese distinctions help choose how to train, but gaps in experience can mislead.","path":["2 · Learning and adaptation — how does behaviour improve?","Reinforcement learning — several independent axes"],"facet":2},{"name":"Deep RL, hierarchical RL and multi-agent RL","detail":"Neural function approximation, temporal abstraction and multiple interacting learners.","source":"rl","id":"topic-042","context":"Deep RL uses neural networks to represent policies, values or other components of reinforcement learning. Hierarchical RL introduces decisions at different temporal or conceptual levels, such as choosing a subgoal and then executing lower-level actions. Multi-agent RL studies learners whose decisions interact with those of other agents. These extensions address different challenges and can be combined in one system. They are useful for high-dimensional observations, long tasks and coordinated behaviour, but introduce additional representation and credit-assignment problems. A richer architecture needs evidence that its added complexity improves the intended decision process.","example":"An illustrative warehouse simulation combines a high-level task allocator with lower-level navigation policies for several robots. Researchers measure completion time, conflicts and robustness when workloads change, comparing the learned coordination scheme with simpler planning and scheduling baselines under the same simulated conditions.","limitation":"Other learning agents make the environment change during training, and delayed rewards complicate credit assignment. Neural capacity and hierarchical structure do not guarantee coordination, safe behaviour or transfer from simulation to real operations.","refs":[{"title":"Between MDPs and semi-MDPs: A framework for temporal abstraction in reinforcement learning","authors":"Richard S. Sutton, Doina Precup and Satinder Singh","year":1999,"kind":"paper","url":"https://people.cs.umass.edu/~barto/courses/cs687/Sutton-Precup-Singh-AIJ99.pdf","canonical_url":"https://doi.org/10.1016/S0004-3702(99)00052-1","access_note":"Working academic mirror of published paper. Publisher returned 403 and old Sutton-hosted routes failed."},{"title":"Playing Atari with Deep Reinforcement Learning","url":"https://arxiv.org/abs/1312.5602","kind":"paper"},{"title":"Multi-Agent Actor-Critic for Mixed Cooperative-Competitive Environments","url":"https://arxiv.org/abs/1706.02275","kind":"paper"}],"related":["topic-009","topic-039","topic-068"],"plain":"Reinforcement learning uses rewards to guide choices.\nDeep: uses a neural network, with layers of calculations that learn from examples.\nHierarchical: chooses goals and smaller steps, like 'make dinner' then 'chop onions'.\nMulti-agent: several learners act at once and affect each other, as players do in a game.\nTheir changing behaviour can make learning harder.","path":["2 · Learning and adaptation — how does behaviour improve?","Reinforcement learning — several independent axes"],"facet":2},{"name":"Instruction / supervised fine-tuning","detail":"Adapt a pretrained model using task demonstrations and instruction–response examples.","source":"foundation","id":"topic-043","context":"Supervised fine-tuning teaches an existing model how a task should be performed by training it on representative inputs and desired outputs. For an assistant, examples can demonstrate response structure, tool-call formats, or how to handle insufficient information. The model's parameters change, unlike ordinary prompting. Good demonstrations can improve consistency without requiring a new model to be trained from scratch. The important design decision is what behaviour the examples reward: polished wording, correct extraction, disciplined abstention, or something else. Evaluation should measure that intended behaviour on held-out cases.","example":"A maintenance team collects reviewed examples that turn free-text work orders into an equipment identifier, symptom category, and evidence quotation. Fine-tuning teaches the extraction format, while a separate validation step checks identifiers against the equipment register before accepting a result.","limitation":"Training on demonstrations can reproduce their mistakes and omissions. Fine-tuning is not a dependable mechanism for keeping changing operational facts current, and improved formatting should not be mistaken for improved factual accuracy.","refs":[{"title":"Training language models to follow instructions with human feedback","url":"https://arxiv.org/abs/2203.02155","kind":"paper"}],"related":["topic-034","topic-044","topic-079"],"plain":"Training shows an existing model examples of how to answer a particular kind of request. This can teach it to turn repair notes into a consistent checklist. It can also copy mistakes in those examples.","path":["2 · Learning and adaptation — how does behaviour improve?","Post-training and preferences"],"facet":2},{"name":"RLHF / RLAIF","detail":"Reinforcement learning from human or AI feedback, often through a learned reward model.","source":"instruct","id":"topic-044","context":"Reinforcement learning from human feedback uses people's evaluations to shape model behaviour, often by first learning a reward model from comparisons between candidate responses. Reinforcement learning from AI feedback substitutes an AI evaluator for some of those judgements. Both approaches turn a judgement process into an optimization signal. They can teach preferences that are difficult to specify as a simple target answer, such as helpfulness or adherence to a set of principles. The resulting behaviour depends strongly on the evaluators, their instructions, and the examples on which they judge.","example":"Reviewers compare two draft explanations of a machinery alarm and prefer the one that separates observations from hypotheses. A reward model learns those preferences, then guides training. Periodic expert audits check that the assistant has not learned to sound cautious while making unsupported claims.","limitation":"A preference signal is an imperfect proxy for the real objective. Human and AI evaluators can share biases, and maximizing their scores can reward convincing presentation or exploit weaknesses in the evaluation process.","refs":[{"title":"Constitutional AI: Harmlessness from AI Feedback","url":"https://arxiv.org/abs/2212.08073","kind":"paper"}],"related":["topic-043","topic-045","topic-082"],"plain":"People or another AI rate answers, and training encourages the model to produce answers they prefer. This helps teach qualities such as clear explanations. The ratings can reward convincing errors.","path":["2 · Learning and adaptation — how does behaviour improve?","Post-training and preferences"],"facet":2},{"name":"Preference optimization / DPO","detail":"Optimize directly from preferences; DPO does not require a separate online RL loop.","source":"dpo","id":"topic-045","context":"Direct preference optimization learns from pairs of preferred and dispreferred responses without running the conventional reward-model-plus-online-RL training loop. It adjusts a model's relative preference for those responses while referencing an initial policy. This makes preference adaptation conceptually and operationally simpler in some settings. DPO is one member of a larger family of preference-learning methods, not a synonym for alignment in general. It is useful when a team can collect meaningful comparisons more easily than it can write perfect target answers or construct an interactive environment.","example":"A support team labels pairs of troubleshooting answers, favouring answers that ask for the missing sensor reading before recommending an action. DPO can adapt a base assistant to those preferences using the comparison dataset, followed by evaluation on new fault scenarios.","limitation":"Preferences can be inconsistent, narrow, or contaminated by style. A simpler training procedure does not remove the need to check factual correctness, distribution shift, and behaviour outside the comparison dataset.","refs":[{"title":"Direct Preference Optimization: Your Language Model is Secretly a Reward Model","url":"https://arxiv.org/abs/2305.18290","kind":"paper"}],"related":["topic-044","topic-043","topic-046"],"plain":"A model learns from pairs of answers, such as a helpful reply and an unhelpful one. DPO learns directly from these comparisons, simplifying part of training. Preferences may favour style over accuracy.","path":["2 · Learning and adaptation — how does behaviour improve?","Post-training and preferences"],"facet":2},{"name":"RL with verifiable rewards / RLVR","detail":"Reward outputs using programmatic checks, such as test results or mathematical answers.","source":"r1","id":"topic-046","context":"Reinforcement learning with verifiable rewards trains a model against outcomes that a program can check. Examples include a correct numerical answer, passing tests, or a proof accepted by a checker. These signals reduce reliance on subjective ratings and can support large amounts of practice. They work especially well when tasks have inexpensive, reliable evaluation and useful variation. The verifier is part of the learning environment: its accepted inputs, tolerances, and hidden assumptions shape what the model learns. Verifiable reward therefore describes the feedback mechanism, not a guarantee about every learned behaviour.","example":"A code-generation model proposes parsers for a family of message formats. Rewards depend on compilation, a hidden test set, and resource limits. Training encourages working solutions, while independent tests cover malformed messages and cases the training verifier did not represent.","limitation":"A model can exploit incomplete tests or learn shortcuts that satisfy a checker without meeting the real requirement. Success transfers most convincingly when deployment tasks admit similarly trustworthy verification.","refs":[{"title":"DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning","url":"https://arxiv.org/abs/2501.12948","kind":"paper"}],"related":["topic-039","topic-070","topic-072"],"plain":"A model practises tasks and gets training rewards when automatic checks accept its answers. For coding, the reward might come from passing tests. Incomplete tests can reward faulty code.","path":["2 · Learning and adaptation — how does behaviour improve?","Post-training and preferences"],"facet":2},{"name":"Transfer learning / domain adaptation / multitask learning","detail":"Reuse or jointly learn representations across tasks or distributions.","source":"foundation","id":"topic-047","context":"Transfer learning reuses knowledge learned on one task or dataset for another. Domain adaptation focuses on changes in the input distribution, such as a new camera or operating environment. Multitask learning trains related tasks together so that they can share useful representations. These approaches can reduce the amount of new labelled data required, but they solve different problems and can be combined. A practical starting point is to identify what should transfer and what must change. Shared vocabulary alone does not establish that the underlying measurements or labels mean the same thing.","example":"An image model trained on one inspection camera is adapted to another vessel's camera and lighting. A shared backbone supports corrosion detection and coating classification, while separate evaluation sets reveal whether the new sensor or task changes the learned decision boundary.","limitation":"Transfer can be negative when source and target tasks rely on different features. Adaptation should be assessed against a target-domain baseline, especially when labels, operating regimes, or sensor characteristics have changed.","refs":[{"title":"Domain-Adversarial Training of Neural Networks","url":"https://arxiv.org/abs/1505.07818","kind":"paper"},{"title":"An Overview of Multi-Task Learning in Deep Neural Networks","url":"https://arxiv.org/abs/1706.05098","kind":"paper"}],"related":["topic-043","topic-054","topic-049"],"plain":"Transfer: reuse earlier learning for a new task.\nAdaptation: adjust to changed conditions, such as a different camera.\nMultitask learning: practise related tasks together.\nThese approaches help share useful learning rather than starting over.\nPoorly matched tasks can interfere with one another.","path":["2 · Learning and adaptation — how does behaviour improve?","Adaptation and data selection"],"facet":2},{"name":"Active learning","detail":"Select the examples whose labels are expected to be most useful.","source":"ml","id":"topic-048","context":"Active learning decides which examples should receive expensive labels. Rather than labelling a random batch, a learner can request cases that would most reduce uncertainty, cover poorly represented regions, or resolve disagreement between models. The loop alternates selection, annotation, retraining, and evaluation. This is particularly useful when expert time is the bottleneck and an unlabelled pool is available. Selection rules need to account for annotation cost and sample diversity; repeatedly asking about nearly identical ambiguous cases can consume the budget without meaningfully expanding the model's competence.","example":"An inspection team has thousands of unlabelled sonar images but limited specialist time. The system proposes a diverse set of uncertain examples for review. Experts label those images, and a fixed, separately sampled test set measures whether the next model improves.","limitation":"Uncertainty estimates can be poor, and unusual examples may be uninformative or impossible to label. A deliberately selected training set also cannot replace a representative evaluation set for estimating real-world performance.","refs":[{"title":"Bayesian Active Learning for Classification and Preference Learning","url":"https://arxiv.org/abs/1112.5745","kind":"paper"}],"related":["topic-034","topic-082","topic-036"],"plain":"A model picks examples for an expert to label, such as photographs it struggles to sort. The aim is to use expert time where it helps most. Confusing examples are not always useful ones.","path":["2 · Learning and adaptation — how does behaviour improve?","Adaptation and data selection"],"facet":2},{"name":"Meta-learning","detail":"Learn an initialization, update rule or representation that supports rapid adaptation.","source":null,"id":"topic-049","context":"Meta-learning aims to learn something about the learning process itself. Across a collection of tasks, a system may learn an initialization, an update rule, a distance metric, or a representation that makes adaptation to a new task easier. The training unit is therefore often a small learning problem rather than an isolated example. This can be useful when many related tasks each have little data. The choice of training tasks defines the kind of rapid adaptation being encouraged, so evaluation must use genuinely held-out tasks rather than just new samples of familiar ones.","example":"Suppose many pumps have small sets of labelled vibration faults. A meta-learning experiment treats each pump family as a task and learns an initialization that can adapt using a few examples from a new family. Entire families are held out for evaluation.","limitation":"Rapid adaptation within a carefully chosen task family does not imply general learning ability. Performance may collapse when new tasks violate the structure shared by the tasks used during meta-training.","refs":[{"title":"Model-Agnostic Meta-Learning for Fast Adaptation of Deep Networks","url":"https://arxiv.org/abs/1703.03400","kind":"paper"}],"related":["topic-047","topic-051","topic-052"],"plain":"A model practises learning related tasks, such as different sorting jobs. The aim is to learn a new task from just a few examples. Very different tasks may still defeat it.","path":["2 · Learning and adaptation — how does behaviour improve?","Adaptation and data selection"],"facet":2},{"name":"Online and continual learning","detail":"Update as data/tasks arrive while managing drift and interference with earlier learning.","source":"nested","id":"topic-050","context":"Online learning updates a model as observations arrive. Continual learning adds the challenge of retaining useful earlier capabilities as tasks or distributions change. Approaches include replaying selected old examples, protecting important parameters, and allocating separate capacity to new tasks. The goal is to balance plasticity with stability, not simply to keep training indefinitely. For deployed systems, a complete design also needs versioning, evaluation windows, rollback, and a clear policy for what data may trigger updates. A model's changing parameters are a new source of operational state that must be managed.","example":"A demand forecaster is updated as new seasonal data arrives. Before promotion, each candidate is evaluated on recent demand and a retained set of earlier operating regimes. If improvement on the latest period damages older regimes, the update is investigated or rejected.","limitation":"New training can overwrite earlier capabilities, reinforce contaminated data, or follow temporary noise. Continual learning requires explicit retention and drift criteria; automatic updates alone do not demonstrate successful adaptation.","refs":[{"title":"Nested Learning: The Illusion of Deep Learning Architectures","url":"https://proceedings.neurips.cc/paper_files/paper/2025/hash/4309616aaed8e848009bc4a7ef73b493-Abstract-Conference.html","kind":"paper","doi":"10.52202/085713-1565"},{"title":"Overcoming catastrophic forgetting in neural networks","url":"https://arxiv.org/abs/1612.00796","kind":"paper"}],"related":["topic-047","topic-051","topic-082"],"plain":"Online learning: update a model as new examples arrive.\nContinual learning: also try to keep useful earlier skills.\nA demand forecast can then adapt as buying habits change.\nNew learning can overwrite older skills.","path":["2 · Learning and adaptation — how does behaviour improve?","Adaptation and data selection"],"facet":2},{"name":"Test-time learning / learned memory","detail":"Update parameters or learned memory at inference time; distinct from simply spending more compute.","source":"titans","id":"topic-051","context":"Test-time learning changes learned state while processing deployment inputs. In some designs, a small model serves as the sequence memory and is updated using a self-supervised objective; other designs adapt selected parameters to the current input distribution. This differs from generating a longer answer or retrieving a stored note, neither of which requires parameter updates. Such methods can potentially capture information beyond a fixed context window or adapt to changing signals. Their usefulness depends on what is updated, how long changes persist, and how unstable or malicious input is handled.","example":"A research prototype reads a long stream of machine observations and updates a learned memory module as new patterns arrive. Its predictions are compared with a frozen model and an external-memory baseline, while corrupted sensor intervals test whether adaptation makes the system worse.","limitation":"An update objective available at inference time may not track task correctness. Persistent changes introduce interference, poisoning, and reproducibility questions, so successful research benchmarks should not be read as general deployment assurance.","refs":[{"title":"Nested Learning: The Illusion of Deep Learning Architectures","url":"https://proceedings.neurips.cc/paper_files/paper/2025/hash/4309616aaed8e848009bc4a7ef73b493-Abstract-Conference.html","kind":"paper","doi":"10.52202/085713-1565"},{"title":"Learning to (Learn at Test Time): RNNs with Expressive Hidden States","url":"https://arxiv.org/abs/2407.04620","kind":"paper"}],"related":["topic-050","topic-069","topic-070"],"plain":"Some models change their parameters or learned memory while handling new inputs. This can help them use a long stream of observations or adjust to changing conditions. Misleading inputs can steer those updates in the wrong direction.","path":["2 · Learning and adaptation — how does behaviour improve?","Adaptation and data selection"],"facet":2},{"name":"In-context learning","detail":"Adapt outputs using examples/context without necessarily updating model weights.","source":"foundation","id":"topic-052","context":"In-context learning changes a model's responses by supplying examples or instructions inside its input context. The model's deployed weights normally remain unchanged. Examples can demonstrate a label convention, an output schema, or how to solve a new kind of problem. The behaviour is recreated when the relevant context is provided, rather than necessarily being retained as a permanent skill. This makes the technique convenient for experimenting with tasks before committing to training. Example selection, ordering, formatting, and similarity to the actual query can all influence results, so a single successful prompt is weak evidence.","example":"A user provides three reviewed examples of equipment descriptions mapped to an ontology, then asks the model to map another description using the same convention. The examples guide the current request; they do not automatically update the model's behaviour in later sessions.","limitation":"Demonstrations can anchor the model to misleading patterns or leak answers into evaluation. In-context success does not show that the model has acquired a stable skill or a verified understanding of the underlying rule.","refs":[{"title":"Language Models are Few-Shot Learners","url":"https://arxiv.org/abs/2005.14165","kind":"paper"}],"related":["topic-037","topic-043","topic-069"],"plain":"You give a model a few examples alongside your request, such as three correctly completed forms. It uses those examples to follow your format, usually without changing its parameters. The effect may disappear when the examples are removed.","path":["2 · Learning and adaptation — how does behaviour improve?","Adaptation and data selection"],"facet":2},{"name":"Foundation models","detail":"Broad pretraining with reuse across tasks; can be generative or representation models.","source":"foundation","id":"topic-053","context":"A foundation model is pretrained on broad data and designed to support adaptation to many downstream tasks. The term describes a role in an ecosystem, not one architecture, modality, or parameter count. A reusable visual encoder can be a foundation model without generating text, while a language model can become one component of a larger application. Reuse reduces the need to build every task model from the beginning, but also concentrates dependencies: training choices, representation gaps, and failure patterns can propagate into many applications built on the same base.","example":"A general visual encoder is reused for sorting inspection images, finding similar defects, and supporting a specialist classifier. Each application supplies its own labelled evaluation set and decision rules, even though all three rely on the same pretrained representation underneath.","limitation":"Broad capability does not establish suitability for a particular industrial setting. Downstream evaluations must test relevant populations, operating conditions, and failure costs rather than assuming that general benchmarks transfer.","refs":[{"title":"On the Opportunities and Risks of Foundation Models","url":"https://arxiv.org/abs/2108.07258","kind":"paper"}],"related":["topic-047","topic-054","topic-057","topic-093"],"plain":"A foundation model is a reusable starting point trained on a broad collection of data. Different teams can adapt it for jobs such as searching images or drafting text. Broad training can miss a specialist task's needs.","path":["3 · Model roles — what does the model represent or produce?","Scope and reuse"],"facet":3},{"name":"Task-specific and domain-specialised models","detail":"Scope/specialisation choices that can overlap foundation-model adaptation.","source":"foundation","id":"topic-054","context":"A task-specific model is optimized for a defined job, while a domain-specialised model focuses on a particular body of language, data, or practice. Specialisation can come from training from scratch, continued pretraining, supervised adaptation, or a deliberately narrow architecture. It can improve terminology handling and reduce unnecessary complexity. The central question is which information belongs in the model and which should remain in a maintained external source. Stable patterns may suit training; frequently changing procedures, asset records, or limits often require explicit retrieval and version control instead.","example":"A model is adapted to identify equipment, failure modes, and maintenance actions in engineering reports. The model learns the domain's language, while current asset identifiers and approved procedures are retrieved from maintained systems and checked separately before any operational use.","limitation":"Specialisation can reduce performance outside the target domain and overfit local conventions. Domain fluency is not evidence that a model knows the current approved procedure or can make an operational decision safely.","refs":[{"title":"BioBERT: a pre-trained biomedical language representation model for biomedical text mining","url":"https://arxiv.org/abs/1901.08746","kind":"paper"}],"related":["topic-043","topic-053","topic-063"],"plain":"A model can specialise in one job or field, like a tool designed for a particular trade. This helps it handle tasks such as sorting repair reports or interpreting specialist vocabulary. Its knowledge can still be outdated.","path":["3 · Model roles — what does the model represent or produce?","Scope and reuse"],"facet":3},{"name":"Small / edge / compact models","detail":"Size and deployment properties; not a separate learning paradigm.","source":null,"id":"topic-055","context":"Small and edge models are described by their resource footprint and deployment setting, not by a separate learning paradigm. A compact model may be trained directly, distilled from a larger one, or compressed for a particular device. Local execution can reduce network dependence and keep some processing close to the data. The useful size is determined by the task, available memory, latency budget, energy use, and required quality. A narrow, well-evaluated local model can be more appropriate than a broadly capable remote model, but compactness alone does not make either choice better.","example":"A vessel runs a compact speech-command classifier locally so that basic functions remain available without reliable connectivity. The evaluation includes engine noise, accents, power consumption, and failure handling; uncertain commands require confirmation rather than being inferred from a weak match.","limitation":"A small model can still produce confident errors or leak sensitive information through its outputs. Hardware compatibility, context length, and real device measurements matter more than parameter count alone.","refs":[{"title":"Phi-3 Technical Report: A Highly Capable Language Model Locally on Your Phone","url":"https://arxiv.org/abs/2404.14219","kind":"paper"}],"related":["topic-054","topic-078","topic-081"],"plain":"A compact model is built to use less memory or computing work, sometimes running on a phone. It can help a device work without sending each request over a network. Small models can still make confident mistakes.","path":["3 · Model roles — what does the model represent or produce?","Scope and reuse"],"facet":3},{"name":"Language models / LLMs","detail":"Models of language or token sequences; modern examples need not all be autoregressive.","source":"llada","id":"topic-056","context":"A language model learns patterns over language represented as tokens and uses them for prediction or generation. Many modern LLMs generate one token after another, but language modelling also includes masked prediction and diffusion-based generation. The model's architecture, training objective, scale, and adaptation are separate choices. Language models are useful as flexible interfaces for summarization, extraction, translation, and code, especially when tasks resist a fixed set of rules. They model regularities in their training experience; connecting a fluent output to reliable evidence or an executable action requires additional system design.","example":"An engineer asks for a plain-language summary of an incident report. A language model drafts the summary, while the interface links each key statement to the source passage and preserves uncertainty where the report describes a suspected cause rather than a confirmed finding.","limitation":"Fluent continuation can include invented details, and token likelihood is not a calibrated probability that a claim is true. LLM performance should be measured for the actual task and input conditions.","refs":[{"title":"BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding","authors":"Jacob Devlin, Ming-Wei Chang, Kenton Lee and Kristina Toutanova","year":2019,"kind":"paper","url":"https://aclanthology.org/N19-1423/"},{"title":"Language Models are Few-Shot Learners","authors":"Tom B. Brown and colleagues","year":2020,"kind":"paper","url":"https://arxiv.org/abs/2005.14165"},{"title":"Attention Is All You Need","url":"https://arxiv.org/abs/1706.03762","kind":"paper"},{"title":"Large Language Diffusion Models","url":"https://arxiv.org/abs/2502.09992","kind":"paper"}],"related":["topic-022","topic-027","topic-033"],"plain":"A language model learns patterns in words and how they fit together. It can use these patterns to draft emails, translate text or summarise a report. Fluent answers can contain invented details.","path":["3 · Model roles — what does the model represent or produce?","Modalities and interfaces"],"facet":3},{"name":"Vision, audio, video and multimodal models","detail":"Single-modal or cross-modal inputs/outputs; capabilities need not be symmetric.","source":"foundation","id":"topic-057","context":"Multimodal models connect information across modalities such as text, images, audio, and video. Some align separate encoders in a shared representation space; others integrate several input streams into a generative model. The available input and output combinations are often asymmetric: understanding an image does not imply being able to generate one, and transcribing speech does not imply understanding every acoustic event. Useful applications combine complementary evidence, such as an image showing a defect and a report explaining its context. Evaluation must preserve timing, provenance, and differences in quality between the input sources.","example":"An inspection assistant receives a photograph, a spoken observation, and an equipment identifier. It extracts visible evidence and transcribes the observation, then presents both alongside the asset record. The reviewer can distinguish what was seen in the image from what someone reported verbally.","limitation":"Models can over-rely on one modality, misalign timestamps, or invent details in poor-quality inputs. Strong performance on image–text benchmarks does not establish competence with industrial audio, video, or sensor combinations.","refs":[{"title":"Learning Transferable Visual Models From Natural Language Supervision","url":"https://arxiv.org/abs/2103.00020","kind":"paper"},{"title":"Robust Speech Recognition via Large-Scale Weak Supervision","url":"https://arxiv.org/abs/2212.04356","kind":"paper"}],"related":["topic-053","topic-058","topic-059"],"plain":"Models can work with pictures, sound or video, sometimes combining them with text. For example, a photograph and written report can jointly help describe a damaged part. Reading pictures does not imply being able to create them.","path":["3 · Model roles — what does the model represent or produce?","Modalities and interfaces"],"facet":3},{"name":"Embedding, ranking and predictive models","detail":"Produce representations, relevance scores or forecasts rather than generated content.","source":"ml","id":"topic-058","context":"Embedding models map inputs into vectors that make useful relationships easier to compute. Ranking models score candidates for a query or context, while predictive models estimate a target such as demand or failure probability. These roles often appear in the same system but have different objectives and evaluation measures. A retriever needs relevant items in its candidate set; a reranker needs to order them well; a forecaster needs accurate predictions at the required horizon. None requires a conversational response, and their outputs can support deterministic workflows as well as generative applications.","example":"An equipment-search tool embeds maintenance descriptions to retrieve candidate assets, then reranks them using the query and candidate text together. A separate failure model estimates risk from time-series measurements. The interface keeps relevance scores and failure probabilities distinct because they measure different things.","limitation":"Embedding similarity is not equivalence, causality, or a truth score. Rankings and forecasts need task-specific evaluation, and changing the model or preprocessing can alter the meaning of previously stored vectors.","refs":[{"title":"Sentence-BERT: Sentence Embeddings using Siamese BERT-Networks","url":"https://arxiv.org/abs/1908.10084","kind":"paper"}],"related":["topic-015","topic-063","topic-065"],"plain":"Embeddings: turn items into lists of numbers that help compare them.\nRanking: put promising search results first.\nPrediction: estimate something, such as tomorrow's demand.\nThese support search and decisions without needing a conversation.\nSimilarity is not proof that two items mean the same.","path":["3 · Model roles — what does the model represent or produce?","Modalities and interfaces"],"facet":3},{"name":"Vision–language–action / VLA models","detail":"Map visual and linguistic context into robot actions; embodied deployment remains task dependent.","source":"vla","id":"topic-059","context":"Vision–language–action models connect visual observations and language instructions to actions, often through training on robot demonstrations. Instead of stopping at a verbal plan, the system produces an action representation that can be passed into a control pipeline. Some approaches express actions as tokens, making it possible to reuse modelling machinery developed for language. The promise is a more flexible mapping from instructions and scenes to behaviour. In a real robot, this model is only one layer: sensing, timing, collision constraints, low-level control, and recovery still determine whether the overall system works.","example":"A laboratory robot is instructed to place a specified component into a tray. A VLA policy interprets the image and instruction, while a controller constrains motion and monitors execution. Evaluation varies lighting, object placement, and distractors rather than repeating only familiar demonstration scenes.","limitation":"Robotic generalization is limited by training coverage, embodiment, and the control interface. A correct verbal description of an action is not proof that the model can execute it reliably in the physical world.","refs":[{"title":"RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control","url":"https://arxiv.org/abs/2307.15818","kind":"paper"}],"related":["topic-057","topic-060","topic-076"],"plain":"A model links what a robot sees with instructions such as 'pick up the cup'. It proposes actions for the robot's movement controls to carry out. Unfamiliar objects or situations can still cause failures.","path":["3 · Model roles — what does the model represent or produce?","Modalities and interfaces"],"facet":3},{"name":"World models","detail":"Predict environment evolution, often conditioned on actions; can operate in latent, symbolic or observable space.","source":"world","id":"topic-060","context":"A world model predicts how an environment changes, often in response to actions. It may predict observable frames, compact latent states, rewards, or other quantities needed for planning. Generating realistic video is one possible approach, not the definition of a world model. A useful model lets a controller compare possible futures before acting. Its quality therefore depends on the decisions it supports: visual realism, short-term prediction accuracy, and long-horizon planning accuracy are different goals. Current research combines learned representations, video data, and interaction data in several distinct ways.","example":"A planning system evaluates alternative paths for a mobile inspection robot by predicting likely observations and progress along each path. It selects a candidate action, observes the real outcome, and replans. The experiment measures decision quality as well as prediction error over time.","limitation":"Prediction errors can compound during imagined rollouts. A plausible simulated future may miss rare events, causal effects, or contact dynamics, so planning must account for model uncertainty and real-world feedback.","refs":[{"title":"Genie 3 — Google DeepMind","url":"https://deepmind.google/models/genie/","kind":"documentation"},{"title":"World Models","authors":"David Ha and Jürgen Schmidhuber","year":2018,"kind":"paper","url":"https://arxiv.org/abs/1803.10122"},{"title":"Dream to Control: Learning Behaviors by Latent Imagination","authors":"Danijar Hafner, Timothy Lillicrap, Jimmy Ba and Mohammad Norouzi","year":2020,"kind":"paper","url":"https://arxiv.org/abs/1912.01603"},{"title":"Integrated Modeling and Control Based on Reinforcement Learning and Dynamic Programming","authors":"Richard S. Sutton","year":1990,"kind":"paper","url":"https://papers.neurips.cc/paper_files/paper/1990/hash/d9fc5b73a8d78fad3d6dffe419384e70-Abstract.html"},{"title":"V-JEPA 2: Self-Supervised Video Models Enable Understanding, Prediction and Planning","url":"https://arxiv.org/abs/2506.09985","kind":"paper"}],"related":["topic-039","topic-059","topic-076"],"plain":"A world model predicts what might happen next, including what an action could change. A robot could compare predicted outcomes before choosing where to move. Predictions can drift further from reality over time.","path":["3 · Model roles — what does the model represent or produce?","Dynamics and scientific structure"],"facet":3},{"name":"Physics-informed and scientific ML","detail":"Combine learned models with equations, symmetries, physical constraints or numerical solvers.","source":null,"id":"topic-061","context":"Physics-informed learning incorporates scientific structure into a model rather than relying entirely on observed examples. A neural model may be penalized for violating a differential equation, constrained to respect a symmetry, or coupled to a numerical simulator. These are different integration choices with different guarantees. The approach can be helpful when measurements are sparse but governing relationships are known. The physics itself must be assessed: idealized equations, uncertain boundary conditions, and unmodelled processes can produce a neat but misleading result. Scientific validation still requires comparison with relevant experiments or trusted numerical solutions.","example":"A researcher estimates a temperature field from a small number of sensors while penalizing departures from a heat-transfer equation. Separate measurements test the inferred field, and alternative boundary assumptions are explored to show how much the result depends on conditions that were not directly observed.","limitation":"A soft physics penalty does not guarantee exact conservation or numerical accuracy. Incorrect equations or boundary assumptions can impose systematic error, and optimization may struggle with stiff or multiscale systems.","refs":[{"title":"Physics Informed Deep Learning (Part I): Data-driven Solutions of Nonlinear Partial Differential Equations","url":"https://arxiv.org/abs/1711.10561","kind":"paper"}],"related":["topic-018","topic-062","topic-075","topic-092"],"plain":"Known physical laws can guide a model, such as rules describing how heat moves. This can help estimate temperatures between sensors while drawing on established scientific knowledge. Predictions can still conflict with those physical laws.","path":["3 · Model roles — what does the model represent or produce?","Dynamics and scientific structure"],"facet":3},{"name":"Neural operators","detail":"Learn mappings between functions, for example solution operators for families of physical systems.","source":null,"id":"topic-062","context":"Neural operators learn mappings between functions, such as a mapping from a spatial coefficient field and boundary conditions to a solution field. Training across many simulated or observed cases can produce a surrogate that evaluates new cases quickly. This differs from fitting one solution at a set of coordinates. Operator-learning architectures aim to represent relationships that are less tied to a particular discretization, although practical generalization still needs testing. They are useful for repeated analyses, inverse problems, or optimization where running a full numerical solver for every candidate would be expensive.","example":"A surrogate is trained on many flow simulations with varying inlet conditions. Engineers use it to screen candidate configurations, then rerun shortlisted designs with a trusted solver. Tests vary both the operating regime and mesh resolution to check which improvements actually generalize.","limitation":"Fast evaluation does not establish accuracy outside the training distribution or at every resolution. Error, conservation behaviour, and performance on difficult regimes must be assessed before replacing a trusted numerical workflow.","refs":[{"title":"Fourier Neural Operator for Parametric Partial Differential Equations","url":"https://arxiv.org/abs/2010.08895","kind":"paper"}],"related":["topic-061","topic-060","topic-047"],"plain":"A neural operator learns to turn one whole pattern into another, such as pressure across a pipe network. Use it to estimate many similar cases without running a full physics calculation each time. New conditions still need checks.","path":["3 · Model roles — what does the model represent or produce?","Dynamics and scientific structure"],"facet":3},{"id":"topic-086","name":"Anomaly and novelty detection","detail":"Score unusual observations with isolation, density, distance, reconstruction or one-class methods.","context":"Anomaly detection looks for observations that depart from an expected pattern, often when examples of every possible failure are unavailable. Methods include isolation forests, local density estimates, one-class classifiers and reconstruction models. An isolation forest repeatedly partitions data; observations separated after relatively few splits receive higher anomaly scores. Novelty detection usually learns a reference pattern from data assumed to be normal, whereas outlier detection may start with a contaminated dataset. The output is typically a score that must be converted into an operational alert. These methods are useful for equipment monitoring, unusual transactions and data-quality checks.","example":"A maintenance team models vibration and temperature during known operating modes of a pump. Unusual combinations enter an inspection queue, together with recent sensor history. Engineers distinguish a failing bearing from a new operating regime before using the event as future training evidence.","limitation":"Unusual does not necessarily mean harmful, and common failures can look statistically ordinary. Thresholds, changing operating conditions and rare-event base rates strongly affect false alarms; a high anomaly score does not diagnose a cause.","refs":[{"title":"Isolation Forest","url":"https://cs.nju.edu.cn/zhouzh/zhouzh.files/publication/icdm08b.pdf","kind":"paper"},{"title":"Novelty and Outlier Detection — scikit-learn","url":"https://scikit-learn.org/stable/modules/outlier_detection.html","kind":"documentation"}],"related":["topic-013","topic-015","topic-035","topic-082","topic-090"],"plain":"These methods fla
