  <script>
  (() => {
    const root = document.getElementById('ai-classification-tree');
    const atlas = {"tree":[{"name":"1 · Computational methods — what performs the computation?","children":[{"name":"Symbolic knowledge and reasoning","children":[{"name":"Rules and expert systems","detail":"Explicit rules plus a knowledge base and an inference procedure; forward or backward chaining.","source":null,"id":"topic-001"},{"name":"Logic, theorem proving and program synthesis","detail":"Deduction, proof search and construction of programs satisfying a specification.","source":null,"id":"topic-002"},{"name":"Ontologies and knowledge graphs","detail":"Structured entities, relations and axioms; reasoning requires suitable semantics and inference machinery.","source":"owl","id":"topic-003"},{"name":"Fuzzy logic","detail":"Degrees of membership or truth for vague concepts; these are not the same as probabilities.","source":null,"id":"topic-004"},{"name":"Case-based reasoning","detail":"Retrieve and adapt solutions from similar previous cases.","source":null,"id":"topic-005"}],"open":false,"id":"group-1-computational-methods-what-performs-the-computation-symbolic-knowledge-and-reasoning"},{"name":"Search, planning and optimization","children":[{"name":"State-space and heuristic search","detail":"Breadth/depth-first search, A*, beam search and related exploration strategies.","source":null,"id":"topic-006"},{"name":"Game-tree and Monte Carlo tree search","detail":"Minimax, alpha–beta pruning and MCTS; often combined with learned policies or value estimates.","source":null,"id":"topic-007"},{"name":"Constraint solving","detail":"Constraint satisfaction, SAT/SMT and mathematical optimization; also widely used outside AI.","source":null,"id":"topic-008"},{"name":"Automated and decision-theoretic planning","detail":"Classical/temporal planning, hierarchical task networks and planning under uncertainty.","source":null,"id":"topic-009"},{"name":"Evolutionary and population methods","detail":"Genetic algorithms/programming, evolution strategies and swarm methods; not inherently symbolic.","source":null,"id":"topic-010"},{"name":"Bayesian optimization","detail":"A probabilistic surrogate and acquisition rule guide expensive evaluations; overlaps probabilistic ML.","source":null,"id":"topic-011"},{"id":"topic-092","name":"Symbolic regression and equation discovery","detail":"Search for compact mathematical expressions or sparse governing equations that explain observed data."}],"open":false,"id":"group-1-computational-methods-what-performs-the-computation-search-planning-and-optimization"},{"name":"Machine learning — including neural methods","children":[{"name":"Classical statistical models","children":[{"name":"Regression and generalized linear models","detail":"Linear/logistic regression and related regularized predictive models.","source":"ml","id":"topic-012"},{"name":"Trees and ensembles","detail":"Decision trees, random forests, gradient boosting, bagging and stacking.","source":"ml","id":"topic-013"},{"name":"Kernel and instance-based methods","detail":"Support vector machines, kernel methods and nearest-neighbour models.","source":"ml","id":"topic-014"},{"name":"Clustering and dimensionality reduction","detail":"k-means, density-based clustering, PCA, manifold methods and matrix factorization.","source":"ml","id":"topic-015"}],"open":false,"id":"group-1-computational-methods-what-performs-the-computation-machine-learning-including-neural-methods-classical-statistical-models"},{"name":"Probabilistic and causal models","children":[{"name":"Bayesian and graphical models","detail":"Bayesian networks, Markov models, hidden-state models and probabilistic inference.","source":null,"id":"topic-016"},{"name":"Gaussian processes and probabilistic programming","detail":"Distributions over functions or programs for inference with explicit uncertainty.","source":null,"id":"topic-017"},{"name":"Structural causal models","detail":"Represent interventions and causal assumptions; causal conclusions require identification conditions, not correlations alone.","source":null,"id":"topic-018"}],"open":false,"id":"group-1-computational-methods-what-performs-the-computation-machine-learning-including-neural-methods-probabilistic-and-causal-models"},{"name":"Neural architectures and deep learning","children":[{"name":"Feed-forward networks / MLPs","detail":"Learned compositions of nonlinear transformations; a basic neural architecture.","source":null,"id":"topic-019"},{"name":"Convolutional networks / CNNs","detail":"Use shared local filters and spatial structure; also apply to time series and other grids.","source":null,"id":"topic-020"},{"name":"Recurrent networks / LSTM / GRU","detail":"Maintain sequential hidden state for time series, text and other ordered signals.","source":null,"id":"topic-021"},{"name":"Transformers and attention","detail":"Attention-based sequence/representation architectures; training can parallelize token processing.","source":"transformer","id":"topic-022"},{"name":"State-space and recurrent–attention hybrids","detail":"Selective state-space models such as Mamba and mixtures of recurrence with attention.","source":"mamba","id":"topic-023"},{"name":"Graph neural networks / GNNs","detail":"Learn from graph structure, often by propagating and aggregating node or edge information.","source":null,"id":"topic-024"},{"name":"Mixture of experts / MoE","detail":"A router selects expert subnetworks; this is distinct from a team of software agents.","source":null,"id":"topic-025"},{"name":"Spiking and reservoir networks","detail":"Event-based neurons or fixed recurrent dynamics with trained readouts; specialised and research uses.","source":null,"id":"topic-026"}],"open":false,"id":"group-1-computational-methods-what-performs-the-computation-machine-learning-including-neural-methods-neural-architectures-and-deep-learning"},{"name":"Generative formulations — can share architectures","children":[{"name":"Autoregressive models","detail":"Generate by conditioning each element on earlier elements; not limited to text or transformers.","source":null,"id":"topic-027"},{"name":"Variational autoencoders / VAEs","detail":"Latent-variable generation trained with variational inference.","source":"vae","id":"topic-028"},{"name":"Generative adversarial networks / GANs","detail":"Train a generator against a discriminator.","source":"gan","id":"topic-029"},{"name":"Diffusion and score-based models","detail":"Generate through learned reversal of a corruption/noising process.","source":"diffusion","id":"topic-030"},{"name":"Normalizing flows and flow matching","detail":"Learn transformations or vector fields transporting a base distribution towards data.","source":"flow","id":"topic-031"},{"name":"Energy-based models","detail":"Assign an energy to configurations, with inference or sampling favouring lower-energy states.","source":null,"id":"topic-032"},{"name":"Diffusion language models","detail":"Iterative token denoising is an alternative to strictly left-to-right language generation.","source":"llada","id":"topic-033"}],"open":false,"id":"group-1-computational-methods-what-performs-the-computation-machine-learning-including-neural-methods-generative-formulations-can-share-architectures"}],"open":true,"id":"group-1-computational-methods-what-performs-the-computation-machine-learning-including-neural-methods"},{"name":"State estimation and control — adjacent foundations","id":"group-087-state","children":[{"id":"topic-087","name":"State estimation: Kalman and particle filters","detail":"Infer a changing hidden state from noisy measurements and a dynamics model; a classical foundation adjacent to AI."},{"id":"topic-088","name":"Optimal control and model predictive control","detail":"Optimize actions through a dynamics model and constraints; MPC repeatedly replans over a moving horizon."}],"open":false}],"open":true,"id":"group-1-computational-methods-what-performs-the-computation-"},{"name":"2 · Learning and adaptation — how does behaviour improve?","children":[{"name":"Learning signals","children":[{"name":"Supervised learning","detail":"Learn from externally supplied target labels or values.","source":"ml","id":"topic-034"},{"name":"Unsupervised learning","detail":"Discover structure or model distributions without externally supplied task labels.","source":"ml","id":"topic-035"},{"name":"Semi-supervised learning","detail":"Combine labelled and unlabelled examples; pseudo-labelling is one possible method.","source":"ml","id":"topic-036"},{"name":"Self-supervised learning","detail":"Derive prediction targets from the data itself, such as masked content, next tokens or paired views.","source":"foundation","id":"topic-037"},{"name":"Imitation learning","detail":"Learn behaviour from demonstrations; includes behavioural cloning and interactive variants.","source":"rl","id":"topic-038"}],"open":false,"id":"group-2-learning-and-adaptation-how-does-behaviour-improve-learning-signals"},{"name":"Reinforcement learning — several independent axes","children":[{"name":"Model-free ↔ model-based","detail":"Whether learning/planning uses an explicit environment dynamics model.","source":"rl","id":"topic-039"},{"name":"Value-based ↔ policy-based ↔ actor–critic","detail":"How action values and/or the action-selection policy are represented and optimized.","source":"rl","id":"topic-040"},{"name":"Online ↔ offline; on-policy ↔ off-policy","detail":"Data collection and policy relationships are separate choices, not one exclusive hierarchy.","source":"rl","id":"topic-041"},{"name":"Deep RL, hierarchical RL and multi-agent RL","detail":"Neural function approximation, temporal abstraction and multiple interacting learners.","source":"rl","id":"topic-042"}],"open":false,"id":"group-2-learning-and-adaptation-how-does-behaviour-improve-reinforcement-learning-several-independent-axes"},{"name":"Post-training and preferences","children":[{"name":"Instruction / supervised fine-tuning","detail":"Adapt a pretrained model using task demonstrations and instruction–response examples.","source":"foundation","id":"topic-043"},{"name":"RLHF / RLAIF","detail":"Reinforcement learning from human or AI feedback, often through a learned reward model.","source":"instruct","id":"topic-044"},{"name":"Preference optimization / DPO","detail":"Optimize directly from preferences; DPO does not require a separate online RL loop.","source":"dpo","id":"topic-045"},{"name":"RL with verifiable rewards / RLVR","detail":"Reward outputs using programmatic checks, such as test results or mathematical answers.","source":"r1","id":"topic-046"}],"open":false,"id":"group-2-learning-and-adaptation-how-does-behaviour-improve-post-training-and-preferences"},{"name":"Adaptation and data selection","children":[{"name":"Transfer learning / domain adaptation / multitask learning","detail":"Reuse or jointly learn representations across tasks or distributions.","source":"foundation","id":"topic-047"},{"name":"Active learning","detail":"Select the examples whose labels are expected to be most useful.","source":"ml","id":"topic-048"},{"name":"Meta-learning","detail":"Learn an initialization, update rule or representation that supports rapid adaptation.","source":null,"id":"topic-049"},{"name":"Online and continual learning","detail":"Update as data/tasks arrive while managing drift and interference with earlier learning.","source":"nested","id":"topic-050"},{"name":"Test-time learning / learned memory","detail":"Update parameters or learned memory at inference time; distinct from simply spending more compute.","source":"titans","id":"topic-051"},{"name":"In-context learning","detail":"Adapt outputs using examples/context without necessarily updating model weights.","source":"foundation","id":"topic-052"}],"open":false,"id":"group-2-learning-and-adaptation-how-does-behaviour-improve-adaptation-and-data-selection"}],"open":false,"id":"group-2-learning-and-adaptation-how-does-behaviour-improve-"},{"name":"3 · Model roles — what does the model represent or produce?","children":[{"name":"Scope and reuse","children":[{"name":"Foundation models","detail":"Broad pretraining with reuse across tasks; can be generative or representation models.","source":"foundation","id":"topic-053"},{"name":"Task-specific and domain-specialised models","detail":"Scope/specialisation choices that can overlap foundation-model adaptation.","source":"foundation","id":"topic-054"},{"name":"Small / edge / compact models","detail":"Size and deployment properties; not a separate learning paradigm.","source":null,"id":"topic-055"}],"open":false,"id":"group-3-model-roles-what-does-the-model-represent-or-produce-scope-and-reuse"},{"name":"Modalities and interfaces","children":[{"name":"Language models / LLMs","detail":"Models of language or token sequences; modern examples need not all be autoregressive.","source":"llada","id":"topic-056"},{"name":"Vision, audio, video and multimodal models","detail":"Single-modal or cross-modal inputs/outputs; capabilities need not be symmetric.","source":"foundation","id":"topic-057"},{"name":"Embedding, ranking and predictive models","detail":"Produce representations, relevance scores or forecasts rather than generated content.","source":"ml","id":"topic-058"},{"name":"Vision–language–action / VLA models","detail":"Map visual and linguistic context into robot actions; embodied deployment remains task dependent.","source":"vla","id":"topic-059"}],"open":false,"id":"group-3-model-roles-what-does-the-model-represent-or-produce-modalities-and-interfaces"},{"name":"Dynamics and scientific structure","children":[{"name":"World models","detail":"Predict environment evolution, often conditioned on actions; can operate in latent, symbolic or observable space.","source":"world","id":"topic-060"},{"name":"Physics-informed and scientific ML","detail":"Combine learned models with equations, symmetries, physical constraints or numerical solvers.","source":null,"id":"topic-061"},{"name":"Neural operators","detail":"Learn mappings between functions, for example solution operators for families of physical systems.","source":null,"id":"topic-062"}],"open":false,"id":"group-3-model-roles-what-does-the-model-represent-or-produce-dynamics-and-scientific-structure"},{"name":"Detection and monitoring","id":"group-086-detection","children":[{"id":"topic-086","name":"Anomaly and novelty detection","detail":"Score unusual observations with isolation, density, distance, reconstruction or one-class methods."}],"open":false}],"open":false,"id":"group-3-model-roles-what-does-the-model-represent-or-produce-"},{"name":"4 · System patterns — how are components combined?","children":[{"name":"Retrieval and external knowledge","children":[{"name":"Retrieval-augmented generation / RAG","detail":"Retrieve external evidence and condition generation on it; retrieval need not use a vector database.","source":"rag","id":"topic-063"},{"name":"Graph-augmented and structured retrieval","detail":"Retrieve over graphs, relations or structured queries; a graph alone does not establish logical reasoning.","source":null,"id":"topic-064"},{"name":"Hybrid retrieval and reranking","detail":"Combine lexical, vector or structured retrieval and relevance scoring.","source":null,"id":"topic-065"}],"open":false,"id":"group-4-system-patterns-how-are-components-combined-retrieval-and-external-knowledge"},{"name":"Agents and orchestration","children":[{"name":"Tool-using agents","detail":"Select actions, call tools, observe results and continue towards a goal.","source":"react","id":"topic-066"},{"name":"Planning and workflow controllers","detail":"Use plans, state machines, decomposition, checkpoints and replanning to coordinate work.","source":"react","id":"topic-067"},{"name":"Multi-agent systems","detail":"Several agents coordinate, negotiate or compete; more agents do not inherently imply better results.","source":null,"id":"topic-068"},{"name":"External memory and episodic retrieval","detail":"Store/retrieve past events or lessons; no weight update is required.","source":"reflexion","id":"topic-069"}],"open":false,"id":"group-4-system-patterns-how-are-components-combined-agents-and-orchestration"},{"name":"Reasoning and computation at inference time","children":[{"name":"Deliberation and test-time compute","detail":"Allocate more generation, sampling, search or verification to a problem.","source":"r1","id":"topic-070"},{"name":"Self-consistency and candidate search","detail":"Generate alternatives and use aggregation, search or ranking to select an answer.","source":null,"id":"topic-071"},{"name":"Verifier-guided reasoning","detail":"Use tests, solvers, proof checkers or other external feedback to evaluate candidates.","source":"geometry","id":"topic-072"},{"name":"Metacognitive monitoring and control","detail":"Estimate uncertainty/failure, choose another strategy, gather evidence or abstain; self-critique alone is not verification.","source":"reflection","id":"topic-073"}],"open":false,"id":"group-4-system-patterns-how-are-components-combined-reasoning-and-computation-at-inference-time"},{"name":"Hybrid and neuro-symbolic integration","children":[{"name":"Neural proposals + symbolic reasoning","detail":"Neural models propose representations or steps; symbolic engines derive or check consequences.","source":"geometry","id":"topic-074"},{"name":"Differentiable logic and constrained learning","detail":"Bring logical or domain constraints into learning objectives or differentiable inference.","source":null,"id":"topic-075"},{"name":"Learning + planning + simulation","detail":"Combine policies/value models with search and predictive environment models.","source":"world","id":"topic-076"},{"name":"LLMs + evolutionary search + evaluators","detail":"Generate candidate algorithms, evaluate them and iteratively improve the candidate population.","source":"evolve","id":"topic-077"}],"open":false,"id":"group-4-system-patterns-how-are-components-combined-hybrid-and-neuro-symbolic-integration"}],"open":false,"id":"group-4-system-patterns-how-are-components-combined-"},{"name":"5 · Cross-cutting engineering — how is it efficient and dependable?","children":[{"name":"Efficiency and deployment","children":[{"name":"Distillation / pruning / quantization","detail":"Transfer behaviour to smaller models, remove parameters or reduce numerical precision.","source":null,"id":"topic-078"},{"name":"Parameter-efficient tuning / LoRA / adapters","detail":"Adapt a subset or low-rank parameterization instead of updating every weight.","source":null,"id":"topic-079"},{"name":"Federated and privacy-preserving learning","detail":"Distribute training or protect data/updates; federated learning alone does not guarantee privacy.","source":null,"id":"topic-080"},{"name":"Speculative decoding / caching / routing","detail":"Improve serving efficiency; these do not constitute new model intelligence by themselves.","source":null,"id":"topic-081"},{"id":"topic-093","name":"Empirical scaling laws and compute allocation","detail":"Fit relationships between model size, data, compute and measured performance to guide training experiments."}],"open":false,"id":"group-5-cross-cutting-engineering-how-is-it-efficient-and-dependable-efficiency-and-deployment"},{"name":"Uncertainty, checking and oversight","children":[{"name":"Calibration and uncertainty estimation","detail":"Assess how predictive uncertainty corresponds to observed errors; requires evaluation data.","source":null,"id":"topic-082"},{"name":"Conformal prediction and selective prediction","detail":"Construct prediction sets under stated assumptions, or abstain on uncertain cases.","source":null,"id":"topic-083"},{"name":"Constraints, validation and formal verification","detail":"Check specified properties; a proof or validation result is limited by its specification and assumptions.","source":"geometry","id":"topic-084"},{"name":"Interpretability, provenance and human review","detail":"Make evidence, behaviour and decision responsibilities inspectable; not proof of correctness.","source":null,"id":"topic-085"}],"open":false,"id":"group-5-cross-cutting-engineering-how-is-it-efficient-and-dependable-uncertainty-checking-and-oversight"},{"name":"Evaluation, security and governance","id":"group-089-evaluation,","children":[{"id":"topic-089","name":"Adversarial robustness and AI security","detail":"Assess deliberate input manipulation and protect model, data and tool trust boundaries, including prompt injection."},{"id":"topic-090","name":"Evaluation, benchmarking and data leakage","detail":"Design representative tests, separate fitting from assessment, and measure quality, uncertainty, cost and failure modes."},{"id":"topic-091","name":"Fairness, bias assessment and data governance","detail":"Examine who benefits or bears errors, choose explicit fairness criteria, and document how data is collected and used."}],"open":false}],"open":false,"id":"group-5-cross-cutting-engineering-how-is-it-efficient-and-dependable-"}],"topics":[{"name":"Rules and expert systems","detail":"Explicit rules plus a knowledge base and an inference procedure; forward or backward chaining.","source":null,"id":"topic-001","context":"An expert system separates domain knowledge from the procedure that applies it. Facts describe the current situation, rules encode implications, and an inference engine decides which rules can fire. Forward chaining starts with available facts and derives consequences; backward chaining starts with a question and works back to the facts needed to answer it. This makes rule systems useful when requirements are explicit, decisions must be repeatable, and an expert can describe the relevant conditions. Rules may be maintained manually or combined with learned components that supply uncertain observations.","example":"An illustrative maintenance assistant checks whether an inspection is overdue, whether a component is safety critical, and whether an approved replacement exists. It applies documented rules to identify the required next step and shows the rules and facts that led there.","limitation":"Rules do not automatically adapt when operating conditions change. Large rule bases can become inconsistent or hard to maintain, and an apparently precise result can still rely on incomplete or incorrect input facts.","refs":[{"title":"Rules and inference: definite clauses","url":"https://artint.info/3e/html/ArtInt3e.Ch5.S3.html","kind":"textbook"}],"related":["topic-002","topic-003","topic-084"],"plain":"These systems follow written rules, like checking whether a machine is due for an inspection. They help apply the same requirements consistently and show which rules led to a decision. Outdated rules can give wrong answers.","path":["1 · Computational methods — what performs the computation?","Symbolic knowledge and reasoning"],"facet":1},{"name":"Logic, theorem proving and program synthesis","detail":"Deduction, proof search and construction of programs satisfying a specification.","source":null,"id":"topic-002","context":"Logical reasoning operates on statements with formally defined meanings. A theorem prover searches for a derivation from assumptions, while a satisfiability solver asks whether constraints can all hold at once. Program synthesis adds a construction problem: find a program that meets a specification or matches examples. These methods are useful when correctness can be stated precisely, such as checking access rules, finding a schedule, or verifying a small software component. A neural model can propose candidate steps, while a symbolic checker determines whether those steps follow the specified rules.","example":"An illustrative access-control checker represents users, roles and permissions as logical conditions. It searches for a configuration in which an unapproved user could reach a restricted dataset, returning either a counterexample or a result scoped to the encoded policy.","limitation":"Formal guarantees apply to the formal specification and assumptions. They do not establish that the specification captures every real requirement, and expressive reasoning problems can demand substantial time or memory.","refs":[{"title":"Propositions and inference","url":"https://artint.info/3e/html/ArtInt3e.Ch5.html","kind":"textbook"},{"title":"Introduction to the Z3 theorem prover","url":"https://microsoft.github.io/z3guide/docs/logic/intro/","kind":"documentation"}],"related":["topic-008","topic-074","topic-084"],"plain":"Logic: checks what follows from stated assumptions.\nProof search: looks for a chain of valid steps.\nProgram synthesis: builds code to meet stated requirements.\nThese methods can help check software or access rules.\nMissing requirements can leave real problems unnoticed.","path":["1 · Computational methods — what performs the computation?","Symbolic knowledge and reasoning"],"facet":1},{"name":"Ontologies and knowledge graphs","detail":"Structured entities, relations and axioms; reasoning requires suitable semantics and inference machinery.","source":"owl","id":"topic-003","context":"A knowledge graph connects identifiable entities through named relationships. An ontology adds a shared conceptual model: classes, properties and sometimes axioms that define what those relationships mean. This helps information from different systems refer to the same equipment, process or organisation consistently. With a suitable reasoner, explicit assertions can support additional logical conclusions. The graph itself is a representation rather than a complete reasoning system. It becomes useful through queries, validation, inference and applications that preserve the distinction between stated facts, derived claims and missing knowledge.","example":"An illustrative offshore information model links a pump to its vessel, maintenance procedure, inspection records and responsible team. A query can follow these relationships across source systems instead of relying on matching document names or isolated search keywords alone.","limitation":"A graph does not guarantee correct facts or common meaning. Entity identity, modelling choices, provenance and update policy require care; an absent assertion may mean unknown rather than false.","refs":[{"title":"OWL 2 Web Ontology Language Primer","url":"https://www.w3.org/TR/owl2-primer/","kind":"documentation"}],"related":["topic-001","topic-024","topic-064"],"plain":"Knowledge graphs connect things and facts, like machines, parts and their suppliers. Ontologies define shared names and meanings, helping different records fit together. The connections can contain mistakes.","path":["1 · Computational methods — what performs the computation?","Symbolic knowledge and reasoning"],"facet":1},{"name":"Fuzzy logic","detail":"Degrees of membership or truth for vague concepts; these are not the same as probabilities.","source":null,"id":"topic-004","context":"Fuzzy logic represents vague categories using degrees of membership. A temperature can belong partly to a category such as warm, rather than crossing one abrupt threshold between false and true. Rules combine these memberships and, in many controllers, a defuzzification step converts the result into a concrete output. This is useful when experts describe behaviour in qualitative terms and smooth transitions matter. Fuzzy membership describes how well a value fits a concept; probability instead describes uncertainty about events or states. The two can be combined, but answer different questions.","example":"An illustrative ventilation controller combines rules such as increasing airflow when a room is fairly warm and heavily occupied. Gradual membership functions allow the fan setting to change smoothly as sensor readings move between the configured categories over time.","limitation":"Membership functions and rule interactions must be designed and validated. A membership of 0.8 does not mean an 80 percent chance that a statement is true, and smooth control is not automatically safe control.","refs":[{"title":"Fuzzy Sets","authors":"Lotfi A. Zadeh","year":1965,"kind":"paper","url":"https://liphy-annuaire.univ-grenoble-alpes.fr/pages_personnelles/bahram_houchmandzadeh/biblio/Zadeh_FuzzySetTheory_1965.pdf","canonical_url":"https://doi.org/10.1016/S0019-9958(65)90241-X","access_note":"Original article retrieved through an academic mirror and first page visually inspected (turn35view3). Publisher/DOI returned 403 to the tool. Author's Berkeley bibliography independently verifies title, author, June 1965 and pages 338–353 (turn32view8)."},{"title":"Foundations of fuzzy logic","url":"https://www.mathworks.com/help/fuzzy/foundations-of-fuzzy-logic.html","kind":"documentation"}],"related":["topic-001","topic-016","topic-082"],"plain":"Fuzzy logic handles gradual categories, such as 'slightly warm' and 'very warm'. It can turn these descriptions into rules for adjusting a heater. These degrees describe fit, not chances of being true.","path":["1 · Computational methods — what performs the computation?","Symbolic knowledge and reasoning"],"facet":1},{"name":"Case-based reasoning","detail":"Retrieve and adapt solutions from similar previous cases.","source":null,"id":"topic-005","context":"Case-based reasoning approaches a new problem by retrieving similar previous cases, adapting their solutions, and retaining useful experience. A case may include the context, symptoms, action taken and observed outcome. The key design choices are how similarity is measured, which differences matter, and how a past solution should be adjusted. This is useful when experienced practitioners recognise recurring situations but cannot easily express a complete rule set. It differs from simply retrieving a document because the system also needs a reasoned adaptation and an outcome-aware learning process.","example":"An illustrative service assistant finds earlier bearing failures with similar vibration patterns, operating loads and temperatures. It presents the repairs used in those cases, highlights differences from the current machine, and records which proposed intervention actually resolved the new issue.","limitation":"A superficially similar case may have a different cause. Biased or poorly documented histories can repeat past mistakes, so adaptation and outcome verification matter as much as retrieval quality.","refs":[{"title":"Case-Based Reasoning: Foundational Issues, Methodological Variations, and System Approaches","url":"https://doi.org/10.3233/AIC-1994-7104","kind":"paper"}],"related":["topic-006","topic-063","topic-069"],"plain":"It reuses past cases, like finding how a similar machine fault was fixed. The old solution is adjusted to help solve the new problem. Similar symptoms can have different causes.","path":["1 · Computational methods — what performs the computation?","Symbolic knowledge and reasoning"],"facet":1},{"name":"State-space and heuristic search","detail":"Breadth/depth-first search, A*, beam search and related exploration strategies.","source":null,"id":"topic-006","context":"Search represents a problem as states and possible transitions, then explores ways to reach a goal. A search strategy determines which candidate state is considered next. Breadth-first and depth-first search use simple ordering, while heuristic methods estimate which states are promising. A* combines accumulated path cost with an estimate of remaining cost; its guarantees depend on the heuristic and search conditions. Search is useful when actions and goals are well defined, including routing, planning and configuration. Learned models can supply heuristics without changing the underlying need to evaluate valid transitions.","example":"An illustrative inspection planner treats each visited location and remaining task list as a state. It explores possible visit orders and uses estimated travel time to prioritise candidates, producing a route subject to the modelled access and equipment constraints.","limitation":"State spaces can grow exponentially. A fast heuristic may be misleading, and methods such as beam search can discard the best solution; guarantees must be tied to the specific algorithm and assumptions.","refs":[{"title":"Searching for solutions","url":"https://artint.info/3e/html/ArtInt3e.Ch3.html","kind":"textbook"}],"related":["topic-007","topic-008","topic-009"],"plain":"Search explores possible steps, like trying routes through a maze. Some methods try promising routes first to find a workable path sooner. Shortcuts can skip the best path.","path":["1 · Computational methods — what performs the computation?","Search, planning and optimization"],"facet":1},{"name":"Game-tree and Monte Carlo tree search","detail":"Minimax, alpha–beta pruning and MCTS; often combined with learned policies or value estimates.","source":null,"id":"topic-007","context":"Game-tree search evaluates sequences of actions and responses. Minimax models an adversary choosing against the agent, and alpha–beta pruning avoids branches that cannot change the decision under that model. Monte Carlo tree search instead allocates simulations to promising branches, balancing exploration with exploitation. It is useful when exhaustive search is impossible but candidate outcomes can be simulated or evaluated. Neural policy and value models can guide the search and estimate unfinished positions. The result is a combination of learned judgement and explicit exploration, not just a larger predictive model.","example":"An illustrative simulator compares several manoeuvres for an autonomous vehicle. Tree search explores possible subsequent conditions, repeatedly sampling outcomes and concentrating effort on promising actions before choosing the next move under the simulator's assumptions and a limited computation budget.","limitation":"Search quality depends on the simulator, evaluation function and available computation. A method designed for adversarial games may be inappropriate for cooperative or uncertain environments without modifying its decision model.","refs":[{"title":"Mastering Chess and Shogi by Self-Play with a General Reinforcement Learning Algorithm","url":"https://arxiv.org/abs/1712.01815","kind":"paper"}],"related":["topic-006","topic-039","topic-076"],"plain":"Game-tree search looks ahead at moves and replies, like thinking through a chess opponent's next move. Monte Carlo tree search tries many possible continuations, spending more effort on promising moves. Both help choose what to do next, but poor forecasts can mislead them.","path":["1 · Computational methods — what performs the computation?","Search, planning and optimization"],"facet":1},{"name":"Constraint solving","detail":"Constraint satisfaction, SAT/SMT and mathematical optimization; also widely used outside AI.","source":null,"id":"topic-008","context":"Constraint solving expresses a problem through variables, their possible values and conditions that must be satisfied. A solver searches for a consistent assignment, or reports that none exists within the encoded problem. SAT handles Boolean formulas; SMT adds theories such as arithmetic, arrays or bit vectors. Constraint programming and mathematical optimisation offer further formulations, including objectives that rank feasible solutions. These tools are valuable when admissible outcomes are easier to describe than a procedure for finding one. They commonly complement predictive models by enforcing hard operational requirements.","example":"An illustrative workforce scheduler assigns qualified staff to shifts while enforcing rest periods, certification requirements and minimum coverage. A predictive model may estimate workload, but the solver determines whether the resulting roster respects the explicitly modelled staffing constraints.","limitation":"A solver can only enforce supplied constraints. Missing requirements produce feasible but unsuitable answers, and inconsistent input may make a problem unsatisfiable without indicating which real-world policy should be revised.","refs":[{"title":"Introduction to the Z3 theorem prover","url":"https://microsoft.github.io/z3guide/docs/logic/intro/","kind":"documentation"}],"related":["topic-002","topic-009","topic-084"],"plain":"A solver fits choices to a set of rules, like making a rota with no clashing shifts. Some solvers also seek the cheapest or best allowed choice. A rule you forgot can spoil the result.","path":["1 · Computational methods — what performs the computation?","Search, planning and optimization"],"facet":1},{"name":"Automated and decision-theoretic planning","detail":"Classical/temporal planning, hierarchical task networks and planning under uncertainty.","source":null,"id":"topic-009","context":"Automated planning constructs actions that move a system from an initial situation towards a goal. Classical planning usually assumes known action effects; temporal planning adds duration and scheduling interactions. Hierarchical planning decomposes larger activities into smaller tasks. Decision-theoretic planning accounts for uncertain transitions, partial observations or competing costs. Planning is useful when a sequence must satisfy dependencies rather than merely predict the next item. A practical system needs explicit action descriptions, state estimation and a way to check execution, because the real environment may diverge from the original plan.","example":"An illustrative maintenance planner orders isolation, inspection, parts replacement and recommissioning steps. It considers which tasks can run concurrently, which specialists are available, and which observations should trigger replanning before the work can proceed to the next stage.","limitation":"A valid plan in a simplified model may fail during execution. Unmodelled effects, uncertain observations and changing resources require monitoring and replanning; language-generated action lists alone do not establish feasibility.","refs":[{"title":"Deterministic planning","url":"https://artint.info/3e/html/ArtInt3e.Ch6.html","kind":"textbook"}],"related":["topic-006","topic-039","topic-067"],"plain":"Planning builds a sequence of actions, like arranging repair tasks in the right order. Some methods also consider timing or uncertain outcomes to help choose a workable plan. Unexpected changes can disrupt the plan.","path":["1 · Computational methods — what performs the computation?","Search, planning and optimization"],"facet":1},{"name":"Evolutionary and population methods","detail":"Genetic algorithms/programming, evolution strategies and swarm methods; not inherently symbolic.","source":null,"id":"topic-010","context":"Evolutionary methods maintain a population of candidate solutions and repeatedly generate, evaluate and select variations. Genetic algorithms often recombine encoded solutions; evolution strategies commonly adjust continuous parameters; genetic programming can evolve executable structures. Population and swarm methods explore through several interacting candidates. These approaches are useful when gradients are unavailable, objectives are irregular, or solutions mix discrete and continuous choices. Their common foundation is search guided by evaluated performance. A language model can propose variations, but the quality of selection still depends on the fitness function and evaluation process.","example":"An illustrative engineering optimiser proposes different hull parameters, evaluates each in a simulator, and retains promising designs while generating variations. Several objectives, such as resistance and manufacturability, can be compared instead of reducing every design consideration to one initial guess.","limitation":"Evaluation can be expensive, and convergence does not prove global optimality. An incomplete fitness function may reward undesirable shortcuts; diversity, constraints and independent validation remain important throughout the search process.","refs":[{"title":"The CMA Evolution Strategy: A Tutorial","authors":"Nikolaus Hansen","year":2016,"kind":"paper","url":"https://arxiv.org/abs/1604.00772"},{"title":"Adaptation in Natural and Artificial Systems: An Introductory Analysis with Applications to Biology, Control, and Artificial Intelligence","authors":"John H. Holland","year":1992,"kind":"textbook","url":"https://mitpress.mit.edu/9780262581110/adaptation-in-natural-and-artificial-systems/"},{"title":"DEAP evolutionary computation framework overview","url":"https://deap.readthedocs.io/en/master/overview.html","kind":"documentation"}],"related":["topic-011","topic-077","topic-084"],"plain":"These methods test groups of possible solutions, then change or combine them using their measured results. Think of trying many designs and improving them over rounds when no simple calculation gives the answer. Poor scoring rules can reward the wrong designs.","path":["1 · Computational methods — what performs the computation?","Search, planning and optimization"],"facet":1},{"name":"Bayesian optimization","detail":"A probabilistic surrogate and acquisition rule guide expensive evaluations; overlaps probabilistic ML.","source":null,"id":"topic-011","context":"Bayesian optimisation chooses informative evaluations of an expensive objective. It builds a surrogate model from past observations, estimates uncertainty, and uses an acquisition rule to choose the next experiment. The rule balances investigating uncertain regions with improving the best result found so far. This is particularly useful when each evaluation costs substantial laboratory time, simulation time or computing resources. The optimiser does not need access to the objective's derivatives. Its assumptions about smoothness, noise, constraints and dimensionality nevertheless strongly affect whether it uses the evaluation budget effectively.","example":"An illustrative materials experiment tunes temperature and mixture proportions. Rather than testing a dense grid, the optimiser recommends the next settings using previous measurements and uncertainty, allowing researchers to spend a limited experimental budget on more informative candidate conditions.","limitation":"Surrogate uncertainty can be miscalibrated, and performance often degrades in very high-dimensional or rapidly changing spaces. Constraints and measurement noise need explicit treatment; exploration should respect operational limits before an experiment runs.","refs":[{"title":"A Tutorial on Bayesian Optimization","authors":"Peter I. Frazier","year":2018,"kind":"paper","url":"https://arxiv.org/abs/1807.02811"},{"title":"Bayesian optimization overview","url":"https://botorch.org/docs/overview","kind":"documentation"}],"related":["topic-010","topic-017","topic-082"],"plain":"When tests cost a lot, this method picks which one to try next. It balances promising settings against unexplored ones, like improving a cake recipe over a few trials. Poor guesses can waste trials.","path":["1 · Computational methods — what performs the computation?","Search, planning and optimization"],"facet":1},{"id":"topic-092","name":"Symbolic regression and equation discovery","detail":"Search for compact mathematical expressions or sparse governing equations that explain observed data.","context":"Symbolic regression searches over mathematical expressions, choosing both a formula's structure and its numerical constants. It balances fit against complexity so that a compact equation can be inspected and tested. Evolutionary search is one approach. Sparse equation-discovery methods such as SINDy instead select a small set of terms from a supplied function library, often to describe changing physical systems. These approaches connect search, statistical learning and scientific modeling. They are useful when an explicit relationship is valuable for interpretation, simulation or engineering design, and when data, units and domain knowledge can constrain the possible expressions.","example":"Engineers measure how a component's pressure drop varies with flow and temperature. A symbolic-regression tool proposes several compact formulas. They reject expressions with inconsistent units, compare held-out predictions, and conduct new experiments before adopting an equation for operating conditions beyond the measurements.","limitation":"A simple equation can fit a limited dataset for the wrong reason. Missing variables, measurement noise, numerical derivatives and the chosen operator library affect discovery; a recovered expression is not automatically a causal law.","refs":[{"title":"Interpretable Machine Learning for Science with PySR and SymbolicRegression.jl","url":"https://arxiv.org/abs/2305.01582","kind":"paper"},{"title":"Discovering governing equations from data: Sparse identification of nonlinear dynamical systems","url":"https://arxiv.org/abs/1509.03580","kind":"paper"}],"related":["topic-010","topic-012","topic-061"],"plain":"These tools search for short formulas that fit measurements, like finding a rule behind a number puzzle. Use them to suggest equations for engineers or scientists to inspect. A good fit may still give the wrong explanation.","path":["1 · Computational methods — what performs the computation?","Search, planning and optimization"],"facet":1},{"name":"Regression and generalized linear models","detail":"Linear/logistic regression and related regularized predictive models.","source":"ml","id":"topic-012","context":"Regression relates input features to an outcome using a specified functional form. Linear models are linear in their coefficients, even when the features include transformations or interactions. Generalized linear models connect the predictor to a suitable outcome distribution through a link function; logistic regression is a familiar classification example. Regularisation constrains fitting to reduce overfitting or encourage simpler representations. These models are useful baselines for structured data and can be easier to inspect than highly flexible alternatives. Feature design, validation splits and interpretation of coefficients remain central parts of the work.","example":"An illustrative energy model estimates a vessel's consumption from speed, displacement and weather features. The team compares predictions with held-out voyages and inspects which variables contribute to the estimate, using the model as a baseline before considering more complex methods.","limitation":"Simple functional assumptions can miss important interactions. Coefficients are not automatically causal effects, and correlated features, leakage or a changing operating regime can make an apparently interpretable model misleading.","refs":[{"title":"Linear models","url":"https://scikit-learn.org/stable/modules/linear_model.html","kind":"documentation"}],"related":["topic-013","topic-018","topic-034"],"plain":"These models fit an equation linking inputs to a result, such as house size to price. Use them as a starting point for predicting a number or a category. A good fit does not prove cause and effect.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Classical statistical models"],"facet":1},{"name":"Trees and ensembles","detail":"Decision trees, random forests, gradient boosting, bagging and stacking.","source":"ml","id":"topic-013","context":"Decision trees divide the feature space through a sequence of tests, producing a prediction at each terminal region. Ensembles combine multiple models to improve generalisation. Random forests diversify trees through sampling and feature selection; boosting builds models sequentially to address remaining errors. Bagging, voting and stacking provide additional ways to combine predictions. These approaches are strong candidates for many structured-data tasks because they can capture nonlinear relationships and interactions without a manually specified equation. Their value should be assessed against simpler baselines using splits that reflect the real deployment setting.","example":"An illustrative failure-risk model combines operating hours, maintenance intervals and sensor summaries to prioritise equipment for review. A gradient-boosted ensemble is compared with logistic regression on later time periods, with operational thresholds chosen using the costs of missed failures and false alarms.","limitation":"Large ensembles are harder to interpret than a single tree. Feature importance is not causal explanation, and these models can struggle with extrapolation beyond training conditions or with poorly controlled data leakage.","refs":[{"title":"Random Forests","authors":"Leo Breiman","year":2001,"kind":"paper","url":"https://link.springer.com/article/10.1023/A:1010933404324","access_note":"Publisher abstract and bibliographic metadata accessible; full article requires access."},{"title":"Greedy Function Approximation: A Gradient Boosting Machine","authors":"Jerome H. Friedman","year":1999,"kind":"paper","url":"https://www.cse.iitb.ac.in/~soumen/readings/papers/Friedman1999GreedyFuncApprox.pdf","canonical_url":"https://doi.org/10.1214/aos/1013203451","access_note":"Academic mirror of the author's primary manuscript; do not label this PDF as the final 2001 typeset article."},{"title":"Ensembles: boosting, random forests, bagging and stacking","url":"https://scikit-learn.org/stable/modules/ensemble.html","kind":"documentation"}],"related":["topic-012","topic-034","topic-085"],"plain":"Trees: ask a series of questions, like checking heat and pressure before predicting a fault.\nEnsembles: combine several models, like asking a panel instead of one person.\nUse them to predict results from recorded measurements.\nUnfamiliar conditions can still mislead them.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Classical statistical models"],"facet":1},{"name":"Kernel and instance-based methods","detail":"Support vector machines, kernel methods and nearest-neighbour models.","source":"ml","id":"topic-014","context":"Kernel methods compare examples using a similarity function that corresponds to an implicit feature representation. Support vector machines use this representation to find a separating boundary or regression function. Instance-based methods such as nearest neighbours retain training examples and predict from nearby cases. Both make the notion of similarity a crucial modelling decision. They are useful for moderate datasets, structured features and tasks with an informative distance measure. Scaling features, selecting the kernel or metric, and tuning regularisation or neighbourhood size can matter more than choosing a more elaborate model name.","example":"An illustrative classifier compares acoustic feature vectors from machinery. A kernel model learns a boundary between operating states, while a nearest-neighbour baseline returns the most similar labelled recordings so an engineer can inspect the examples behind a suggested classification.","limitation":"Similarity can become uninformative in high-dimensional spaces. Kernel training or nearest-neighbour retrieval may be expensive at scale, and an inappropriate metric can produce confident predictions from irrelevant examples despite good training performance.","refs":[{"title":"Support-vector networks","authors":"Corinna Cortes and Vladimir Vapnik","year":1995,"kind":"paper","url":"https://link.springer.com/article/10.1007/BF00994018","access_note":"Publisher abstract and metadata accessible; full article requires access."},{"title":"Support vector machines","url":"https://scikit-learn.org/stable/modules/svm.html","kind":"documentation"},{"title":"Nearest neighbors","url":"https://scikit-learn.org/stable/modules/neighbors.html","kind":"documentation"}],"related":["topic-005","topic-015","topic-058"],"plain":"Kernels: compare examples using a chosen measure of similarity to build predictions.\nNearest neighbours: predict from stored examples that look similar.\nBoth can help classify parts from their size and shape.\nA poor similarity measure can match the wrong examples.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Classical statistical models"],"facet":1},{"name":"Clustering and dimensionality reduction","detail":"k-means, density-based clustering, PCA, manifold methods and matrix factorization.","source":"ml","id":"topic-015","context":"Clustering groups observations according to a chosen notion of similarity or density. Dimensionality reduction instead finds a lower-dimensional representation that preserves selected aspects of the data. PCA captures directions of variance, while manifold methods try to preserve other geometric relationships. These techniques support exploration, compression, visualisation and feature construction. They do not automatically discover the categories a domain expert cares about: the result depends on scaling, distance, model assumptions and parameters. A useful analysis therefore connects the discovered structure to external observations rather than treating an attractive plot as an explanation.","example":"An illustrative analyst groups daily vessel operating profiles and plots a reduced representation of sensor features. They compare the resulting groups with logged activities to see whether they reflect transit, station keeping or data-quality problems, rather than assigning meaning from the plot alone.","limitation":"A cluster is not necessarily a real category, and a two-dimensional embedding can distort relationships. Results may change with scaling or parameter choices; validate interpretations using independent domain information.","refs":[{"title":"Clustering algorithms","url":"https://scikit-learn.org/stable/modules/clustering.html","kind":"documentation"},{"title":"Decomposing signals into components","url":"https://scikit-learn.org/stable/modules/decomposition.html","kind":"documentation"}],"related":["topic-014","topic-035","topic-058"],"plain":"Clustering: groups things that look alike, like sorting a drawer of mixed screws.\nReducing dimensions: keeps fewer numbers to describe each item.\nBoth help you explore patterns or draw a plot.\nThe groups and plots can hide important differences.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Classical statistical models"],"facet":1},{"name":"Bayesian and graphical models","detail":"Bayesian networks, Markov models, hidden-state models and probabilistic inference.","source":null,"id":"topic-016","context":"Probabilistic models describe uncertainty through distributions over variables. Graphical models express dependency structure: Bayesian networks use directed graphs, while other models represent undirected or temporal relationships. Inference updates beliefs when new evidence becomes available, and learning estimates model parameters or structure from data. These methods are useful when observations are noisy, information is incomplete, and uncertainty should remain explicit throughout a decision process. Hidden Markov models are one familiar example for sequences with unobserved state. A graphical structure encodes modelling assumptions; it does not automatically establish a causal interpretation.","example":"An illustrative fault-diagnosis model relates possible component failures to several imperfect sensors. When an alarm arrives, it updates the relative plausibility of different failures and suggests which additional measurement would most help distinguish between the remaining explanations for the observed behaviour.","limitation":"Inference can become computationally difficult, and probabilities depend on the chosen model and data. Independence assumptions may be wrong; uncertainty estimates should be assessed rather than treated as trustworthy merely because they are numeric.","refs":[{"title":"Reasoning with uncertainty","url":"https://artint.info/3e/html/ArtInt3e.Ch9.html","kind":"textbook"}],"related":["topic-017","topic-018","topic-082"],"plain":"These models work with chances and update their estimates when new clues arrive. Some use a graph to link clues, such as heat and noise from a faulty pump. Use them when facts are incomplete, but poor assumptions can mislead.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Probabilistic and causal models"],"facet":1},{"name":"Gaussian processes and probabilistic programming","detail":"Distributions over functions or programs for inference with explicit uncertainty.","source":null,"id":"topic-017","context":"A Gaussian process specifies a distribution over functions, using a covariance kernel to express assumptions about how inputs relate. Observations update the distribution, giving predictions with model-dependent uncertainty. Probabilistic programming addresses a broader task: expressing a generative process as a program with random variables, then applying inference to its unknown quantities. These approaches are useful for small-data prediction, scientific modelling and combining domain assumptions with observations. They make uncertainty part of the model, but do not remove the need to check assumptions, computational approximations or agreement with observed data.","example":"An illustrative calibration model estimates a sensor response from a small number of laboratory measurements. A Gaussian process supplies an interpolated curve and uncertainty, while a probabilistic program can additionally represent shared calibration offsets and differences between individual devices in the experiment.","limitation":"Standard Gaussian-process inference can be costly for large datasets, and kernel choices strongly shape predictions. Probabilistic-program inference may be approximate or poorly converged; neither approach guarantees that its uncertainty reflects all sources of error.","refs":[{"title":"Gaussian Processes for Machine Learning","authors":"Carl Edward Rasmussen and Christopher K. I. Williams","year":2006,"kind":"textbook","url":"https://gaussianprocess.org/gpml/","access_note":"Author-maintained book page links free electronic chapters."},{"title":"Gaussian processes","url":"https://scikit-learn.org/stable/modules/gaussian_process.html","kind":"documentation"},{"title":"Introduction to Pyro probabilistic programming","url":"https://pyro.ai/examples/intro_long.html","kind":"documentation"}],"related":["topic-011","topic-016","topic-082"],"plain":"Gaussian processes: use measurements to predict values and show how unsure those predictions are.\nFor example, estimate heat where a sensor is missing.\nProbabilistic programming: describe a process with unknown parts and use data to estimate them.\nBoth help reason about unknowns, but poor assumptions can mislead.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Probabilistic and causal models"],"facet":1},{"name":"Structural causal models","detail":"Represent interventions and causal assumptions; causal conclusions require identification conditions, not correlations alone.","source":null,"id":"topic-018","context":"Structural causal models represent variables together with assumptions about how they are generated. They distinguish observing a value from intervening to set it, allowing questions about what might happen if a process were changed. Counterfactual reasoning adds questions about alternative outcomes for a particular situation. These models are useful for policy, experimentation and diagnosis when prediction alone is insufficient. Causal identification depends on assumptions such as which variables are confounders and what interventions or data are available. A graph can help make those assumptions explicit without proving that they are correct.","example":"An illustrative operations team asks whether a revised maintenance schedule reduces downtime. A causal model distinguishes equipment age and operating load from the scheduling decision, helping design an experiment or assess whether observational records can support the effect they want to estimate.","limitation":"Correlation and predictive accuracy do not establish causality. Hidden confounding, selection effects and incorrect assumptions can invalidate an estimate; some causal questions cannot be answered from the available observational data alone.","refs":[{"title":"Causality","url":"https://artint.info/3e/html/ArtInt3e.Ch11.html","kind":"textbook"}],"related":["topic-003","topic-012","topic-016"],"plain":"Causal models describe assumptions about what changes what, like how adjusting heat might affect a process. They help ask what could happen after a deliberate change to that process. Hidden influences can make their conclusions wrong.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Probabilistic and causal models"],"facet":1},{"name":"Feed-forward networks / MLPs","detail":"Learned compositions of nonlinear transformations; a basic neural architecture.","source":null,"id":"topic-019","context":"A multilayer perceptron applies learned linear transformations and nonlinear activations in sequence. Training adjusts its weights to reduce a loss on examples, typically using gradients computed by backpropagation. Hidden layers learn intermediate representations rather than requiring every useful interaction to be specified manually. MLPs are versatile building blocks for prediction and are also embedded inside many larger neural architectures. They are useful when nonlinear relationships matter, but do not contain the explicit spatial, sequential or graph structure built into more specialised models. Their flexibility makes data quality and generalisation checks essential.","example":"An illustrative model estimates process quality from temperature, pressure and feed-rate measurements. Hidden layers can learn nonlinear interactions between these variables, while held-out production periods help determine whether the network improves on a simpler regression baseline under realistic operating conditions.","limitation":"More layers or parameters do not automatically improve a task. MLPs can overfit, learn spurious relationships and extrapolate poorly; training stability, feature scaling and validation design need attention.","refs":[{"title":"Neural network models: multilayer perceptrons","url":"https://scikit-learn.org/stable/modules/neural_networks_supervised.html","kind":"documentation"}],"related":["topic-020","topic-021","topic-034"],"plain":"These networks pass information through layers of calculations whose settings are learned from examples. They can connect several measurements, such as heat and pressure, to a predicted result. They may learn accidental patterns in the training examples.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Neural architectures and deep learning"],"facet":1},{"name":"Convolutional networks / CNNs","detail":"Use shared local filters and spatial structure; also apply to time series and other grids.","source":null,"id":"topic-020","context":"Convolutional networks apply shared filters across a structured input, often an image or time series. Early layers can detect local patterns, while deeper layers combine information across larger regions. Sharing parameters makes use of the idea that similar features may occur in different locations. This makes CNNs useful for visual inspection, segmentation and signal analysis, among other tasks. Pooling, strides and architectural design determine how detail and context are retained. A CNN is an architecture: it can be trained with supervised, self-supervised or other objectives depending on the learning problem.","example":"An illustrative inspection system examines images of a welded joint and highlights candidate surface defects. Engineers evaluate performance on new equipment and lighting conditions, keeping the image regions and confidence information available for review instead of accepting an unexplained binary decision.","limitation":"Visual shortcuts such as backgrounds or camera settings can dominate learning. Good benchmark performance may not transfer to a new site, and small or unusual defects can be missed without representative evaluation data.","refs":[{"title":"ImageNet Classification with Deep Convolutional Neural Networks","url":"https://proceedings.neurips.cc/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html","kind":"paper"}],"related":["topic-019","topic-022","topic-037"],"plain":"These networks reuse pattern detectors across an image, like looking for the same crack shape in different places. They combine small patterns into larger ones for tasks such as visual inspection. New lighting can lead to missed defects.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Neural architectures and deep learning"],"facet":1},{"name":"Recurrent networks / LSTM / GRU","detail":"Maintain sequential hidden state for time series, text and other ordered signals.","source":null,"id":"topic-021","context":"Recurrent networks maintain a hidden state that is updated as each input arrives. This gives them a compact way to represent a sequence's history. LSTM and GRU variants use gates to control what information is retained, updated or exposed, helping with some training and memory difficulties of basic recurrence. They are useful for streaming signals, forecasting and sequence processing, especially when sequential operation fits the application. The hidden state is a learned summary rather than a complete record. Model capacity, sequence length and training design determine which past information remains accessible.","example":"An illustrative machine-monitoring model reads pressure and vibration measurements as a stream. Its recurrent state summarises recent behaviour to forecast the next interval, allowing deviations from the expected pattern to be investigated alongside the raw measurements and operating context.","limitation":"Long-range dependencies may still be lost, and sequential processing can limit parallelism. Forecast quality depends on regime stability and representative histories; a hidden state should not be confused with a reliable audit trail.","refs":[{"title":"Finding Structure in Time","authors":"Jeffrey L. Elman","year":1990,"kind":"paper","url":"https://onlinelibrary.wiley.com/doi/10.1207/s15516709cog1402_1"},{"title":"Long Short-Term Memory","authors":"Sepp Hochreiter and Jürgen Schmidhuber","year":1997,"kind":"paper","url":"https://ml.jku.at/publications/older/2604.pdf","canonical_url":"https://doi.org/10.1162/neco.1997.9.8.1735","access_note":"Working author-institution PDF, reached from the JKU publication listing (turn35view2). Older bioinf.jku.at hostname timed out; publisher route returned 403."},{"title":"Learning Phrase Representations using RNN Encoder-Decoder for Statistical Machine Translation","authors":"Kyunghyun Cho and colleagues","year":2014,"kind":"paper","url":"https://arxiv.org/abs/1406.1078"},{"title":"Recurrent neural networks","url":"https://d2l.ai/chapter_recurrent-neural-networks/rnn.html","kind":"textbook"}],"related":["topic-022","topic-023","topic-051","topic-026","topic-087"],"plain":"Recurrent networks update a running summary of a sequence, like keeping notes on changing machine readings. LSTM and GRU versions control what stays in that summary, helping with forecasts and other sequence tasks. Earlier details can still be lost.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Neural architectures and deep learning"],"facet":1},{"name":"Transformers and attention","detail":"Attention-based sequence/representation architectures; training can parallelize token processing.","source":"transformer","id":"topic-022","context":"Transformers use attention to let representations exchange information according to learned relevance. Positional information supplies sequence structure that attention alone does not specify. Encoder, decoder and encoder–decoder variants support different tasks, from embedding documents to generating language. Their architecture enables substantial parallelism during training, although autoregressive generation still proceeds through dependent output steps. Transformers are useful across language, vision, audio and multimodal modelling. They are an architectural family rather than a synonym for language models or reasoning systems: the training objective, data and surrounding tools determine much of what a particular system can do.","example":"An illustrative document model connects a technical term to relevant definitions elsewhere in its context, then produces a representation for retrieval or classification. A separate decoder-based model may generate an answer, showing that attention supports several roles within the same information workflow.","limitation":"Standard attention can become expensive for long inputs. Attention weights are not a complete explanation, and the ability to connect context does not guarantee factual accuracy, faithful reasoning or reliable handling of unfamiliar situations.","refs":[{"title":"Attention Is All You Need","url":"https://arxiv.org/abs/1706.03762","kind":"paper"}],"related":["topic-023","topic-025","topic-053"],"plain":"A transformer learns which parts of its input can help interpret other parts. For example, it can link a word to a clue elsewhere in a text. This helps with tasks such as translation, but useful links do not ensure true answers.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Neural architectures and deep learning"],"facet":1},{"name":"State-space and recurrent–attention hybrids","detail":"Selective state-space models such as Mamba and mixtures of recurrence with attention.","source":"mamba","id":"topic-023","context":"State-space sequence models update a compact internal state as inputs arrive. Selective variants such as Mamba make aspects of that update depend on the current input, helping decide what information to retain or discard. Hybrid architectures combine recurrence or state-space blocks with attention. These approaches investigate different trade-offs between memory, computation and access to past information. They are useful candidates for long sequences and streaming applications, but should be compared on the actual task and hardware. Compressing history into state changes how information is represented; it is not equivalent to attending to every earlier token.","example":"An illustrative monitoring system processes long sensor streams with limited memory. A state-space model is evaluated against an LSTM and a transformer for forecast accuracy, inference cost and its ability to recognise an event whose relevant precursor occurred much earlier in the recording.","limitation":"Efficient sequence scaling does not guarantee better accuracy or lower end-to-end latency. Important information may be compressed away, and performance comparisons depend on workload, implementation, hardware and the size of the competing models.","refs":[{"title":"Mamba: Linear-Time Sequence Modeling with Selective State Spaces","url":"https://arxiv.org/abs/2312.00752","kind":"paper"}],"related":["topic-021","topic-022","topic-051"],"plain":"These models update a running summary as a long stream arrives, like notes on sensor readings. Some versions also look back at earlier items to help process long sequences. The summary can lose important details.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Neural architectures and deep learning"],"facet":1},{"name":"Graph neural networks / GNNs","detail":"Learn from graph structure, often by propagating and aggregating node or edge information.","source":null,"id":"topic-024","context":"Graph neural networks learn representations for data whose relationships form a graph. Many architectures pass messages along edges and aggregate information from neighbours, allowing node or edge predictions to depend on local structure. Repeated layers extend the receptive field across more of the graph. These models are useful for molecules, infrastructure networks, recommendation and relational prediction. Their graph input need not be a formal knowledge graph, and their learned predictions differ from logical entailment. Designing node features, edge meanings and the training objective is as important as selecting the message-passing mechanism.","example":"An illustrative electricity-network model combines equipment attributes with connection structure to identify components requiring investigation. The neighbourhood information can expose patterns that an isolated row of equipment measurements misses, while validation checks whether predictions transfer to previously unseen parts of the network.","limitation":"Graph structure can encode errors or leakage, and deeper message passing may blur distinct node representations. A plausible link prediction is not a proven fact; evaluate generalisation beyond the graph regions seen during training.","refs":[{"title":"Semi-Supervised Classification with Graph Convolutional Networks","url":"https://arxiv.org/abs/1609.02907","kind":"paper"}],"related":["topic-003","topic-019","topic-064"],"plain":"These networks use both things and their links, such as homes and pipes in a water network. They pass information between linked neighbours to help predict what happens across the network. Wrong links can mislead the model.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Neural architectures and deep learning"],"facet":1},{"name":"Mixture of experts / MoE","detail":"A router selects expert subnetworks; this is distinct from a team of software agents.","source":null,"id":"topic-025","context":"A mixture-of-experts model contains several specialised subnetworks and a routing mechanism that selects which ones process an input. In sparse variants, only a subset of experts is activated for each token or example, allowing total parameter capacity to grow without activating every parameter on every step. This is useful for balancing model capacity and computation, especially at scale. The experts are learned components within a model, not independent software agents with goals and tools. Routing, load balancing, communication and memory placement are central engineering concerns alongside the model's predictive quality.","example":"An illustrative language model routes each token through selected feed-forward experts while keeping other parts of the architecture shared. A deployment team measures active computation, memory requirements and communication overhead to determine whether the sparse design fits its serving environment and expected workload.","limitation":"Sparse activation does not mean the whole model fits in little memory. Uneven routing and communication can erode efficiency, and expert names should not be interpreted as reliable human-readable specialisations without evidence.","refs":[{"title":"Switch Transformers: Scaling to Trillion Parameter Models with Simple and Efficient Sparsity","url":"https://arxiv.org/abs/2101.03961","kind":"paper"}],"related":["topic-022","topic-055","topic-081"],"plain":"A mixture-of-experts model splits work among parts of a model, like a team sharing tasks. Some versions call on only a few parts for each input, which can cut computing work. All the parts may still need lots of memory.","path":["1 · Computational methods — what performs the computation?","Machine learning — including neural methods","Neural architectures and deep learning"],"facet":1},{"name":"Spiking and reservoir networks","detail":"Event-based neurons or fixed recurrent dynamics with trained readouts; specialised and research uses.","source":null,"id":"topic-026","context":"Spiking networks represent activity through discrete events over time, often using neuron dynamics inspired by biological systems. Reservoir computing instead uses a recurrent dynamical system to transform an input stream, commonly training only a readout rather than the entire recurrent core. These are distinct ideas that can sometimes overlap. They are useful research and engineering approaches for temporal signals, specialised hardware and efficient adaptation. Their practical benefits depend on the data representation and implementation. A biologically inspired design is not automatically more intelligent, more interpretable or more energy efficient than a conventional neural network.","example":"An illustrative event-camera application evaluates a spiking network on sparse visual events, while a separate vibration study tests a reservoir with a trained linear readout. Both experiments compare accuracy and measured resource use against conventional sequence models on the same deployment conditions.","limitation":"Training methods, tooling and hardware support vary considerably. Energy advantages require measurement on the actual system, and a fixed reservoir may fail to represent the temporal dependencies that a task needs.","refs":[{"title":"Networks of Spiking Neurons: The Third Generation of Neural Network Models","authors":"Wolfgang Maass","year":1997,"kind":"paper","url":"https://igi-web.tugraz.at/PDF/85a.pdf","access_note":"Author-institution copy of the published article."},{"title":"Harnessing Nonlinearity: Predicting Chaotic Systems and Saving Energy in Wireless Communication","authors":"Herbert Jaeger and Harald Haas","year":2004,"kind":"paper","url":"https://www.columbia.edu/cu/biology/courses/w4070/Reading_List_Yuste/haas_04.pdf","access_note
