g things that look out of place, such as odd readings from a pump. Use them to decide what needs a closer look. Unusual does not always mean faulty.","path":["3 · Model roles — what does the model represent or produce?","Detection and monitoring"],"facet":3},{"name":"Retrieval-augmented generation / RAG","detail":"Retrieve external evidence and condition generation on it; retrieval need not use a vector database.","source":"rag","id":"topic-063","context":"Retrieval-augmented generation supplies a generator with information obtained from an external source for the current request. The workflow usually includes preparing and indexing sources, retrieving candidates, selecting context, and generating an answer with evidence. Retrieval can use lexical matching, vectors, structured queries, or combinations of these. RAG makes it easier to use changing or private information without retraining for every update. The crucial learning point is that retrieval and generation are separate failure points: finding an authoritative document does not ensure the model uses the relevant passage or represents it correctly.","example":"An engineer asks which inspection procedure applies to a pump. The system retrieves the current approved procedure and the equipment classification, then drafts a cited answer. The interface exposes the document revision and relevant passage so that superseded guidance can be detected.","limitation":"RAG can retrieve irrelevant, outdated, incomplete, or unauthorized material, and a generator can still misstate good evidence. Retrieval coverage, access control, citation accuracy, and answer correctness require separate checks.","refs":[{"title":"Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks","url":"https://arxiv.org/abs/2005.11401","kind":"paper"}],"related":["topic-058","topic-064","topic-065"],"plain":"The system looks up useful material before writing an answer. For example, it can check a repair manual while explaining how to fix a fault. It may retrieve the wrong passage or misread it.","path":["4 · System patterns — how are components combined?","Retrieval and external knowledge"],"facet":4},{"name":"Graph-augmented and structured retrieval","detail":"Retrieve over graphs, relations or structured queries; a graph alone does not establish logical reasoning.","source":null,"id":"topic-064","context":"Graph-augmented retrieval uses relationships between entities to locate or organize evidence. A structured query might follow an asset-to-system-to-requirement path, while a graph-summary approach can collect themes across a large document corpus. These methods solve different retrieval problems and should not be treated as a single universal GraphRAG algorithm. Graph structure can support joins, navigation, and aggregation that a nearest-neighbour search does not express directly. Formal inference is an additional capability that depends on the graph's semantics and reasoning engine; the presence of nodes and edges alone is not enough.","example":"A user asks which maintenance requirements affect equipment in a particular subsystem. A structured query follows approved relationships from the subsystem to assets and applicable requirements, then retrieves source passages. Missing relationships are reported as coverage gaps rather than silently interpreted as absence of a requirement.","limitation":"Graphs can contain extraction errors, stale relationships, or missing links. A coherent path through a graph is not automatically a valid inference, and corpus summaries can obscure exceptions or minority evidence.","refs":[{"title":"From Local to Global: A Graph RAG Approach to Query-Focused Summarization","url":"https://arxiv.org/abs/2404.16130","kind":"paper"},{"title":"SPARQL 1.1 Query Language — W3C Recommendation","url":"https://www.w3.org/TR/sparql11-query/","kind":"documentation"}],"related":["topic-003","topic-063","topic-074"],"plain":"The system follows stored links, such as those between a machine, its parts and their repair notes. Use those links to find related facts or summarise a group of documents. Missing or wrong links can mislead the search.","path":["4 · System patterns — how are components combined?","Retrieval and external knowledge"],"facet":4},{"name":"Hybrid retrieval and reranking","detail":"Combine lexical, vector or structured retrieval and relevance scoring.","source":null,"id":"topic-065","context":"Hybrid retrieval combines complementary ways of finding candidate evidence, commonly lexical matching and vector similarity. A fusion method combines their results, and a reranker can examine a smaller candidate set more closely. Lexical retrieval is often useful for exact identifiers and uncommon terminology; semantic retrieval can find paraphrases. Reranking adds another relevance judgement after retrieval. The stages should be evaluated separately: a reranker cannot recover a document that never entered its candidate set. This pattern is useful when users mix natural-language questions with product codes, equipment names, or precise technical phrases. A common pipeline retrieves separate lexical and semantic candidate lists, merges their ranks with a method such as reciprocal rank fusion, then scores query–passage pairs with a reranker. Retrieval recall, fusion quality and reranking precision are separate things to evaluate.","example":"A search for a particular pump alarm includes both an exact fault code and a natural-language symptom. Lexical matching preserves the code, vector search finds relevant paraphrases, and a reranker orders the combined candidates before the user or a generator reads them.","limitation":"Fusion can magnify noisy candidates or hide weaknesses behind a good average score. Evaluate exact identifiers, rare terminology, permissions, and answer-bearing passage recall, not only general semantic relevance.","refs":[{"title":"Reciprocal Rank Fusion outperforms Condorcet and individual Rank Learning Methods","url":"https://cormack.uwaterloo.ca/cormacksigir09-rrf.pdf","kind":"paper"},{"title":"Passage Re-ranking with BERT","url":"https://arxiv.org/abs/1901.04085","kind":"paper"},{"title":"Hybrid search — Elastic documentation","url":"https://www.elastic.co/docs/solutions/search/hybrid-search","kind":"documentation"},{"title":"Retrieve & Re-Rank — Sentence Transformers documentation","url":"https://www.sbert.net/examples/sentence_transformer/applications/retrieve_rerank/README.html","kind":"documentation"}],"related":["topic-058","topic-063","topic-064"],"plain":"Search combines exact words with meaning, then reorders the results to put promising matches first. That helps when a question mixes a product code with an everyday description. Reordering cannot recover documents the search missed.","path":["4 · System patterns — how are components combined?","Retrieval and external knowledge"],"facet":4},{"name":"Tool-using agents","detail":"Select actions, call tools, observe results and continue towards a goal.","source":"react","id":"topic-066","context":"A tool-using agent places a model inside an action-and-observation loop. The model selects a tool or action, receives its result, and uses that observation to decide what to do next. Tools can expose search, calculation, code execution, or application operations. The surrounding controller defines available tools, permissions, budgets, and stopping conditions. This pattern is useful when a task requires information or actions beyond a model's own parameters. Agentic behaviour is therefore a property of the assembled system; a capable language model alone does not establish reliable execution of a multistep task.","example":"An engineering assistant receives a question about an asset, retrieves its record, runs a calculation, and presents the result with the inputs used. If a required measurement is missing, the controller requires clarification instead of allowing the agent to invent a value.","limitation":"A plausible plan can still call the wrong tool, misread a result, or compound errors across steps. Tool permissions, observable outcomes, bounded retries, and clear completion criteria matter as much as model fluency.","refs":[{"title":"ReAct: Synergizing Reasoning and Acting in Language Models","url":"https://arxiv.org/abs/2210.03629","kind":"paper"}],"related":["topic-063","topic-067","topic-073","topic-089"],"plain":"An agent can choose a tool, read its result and decide what to try next. It might look up a machine's record, run a calculation and explain the result. A wrong tool choice can send later steps off course.","path":["4 · System patterns — how are components combined?","Agents and orchestration"],"facet":4},{"name":"Planning and workflow controllers","detail":"Use plans, state machines, decomposition, checkpoints and replanning to coordinate work.","source":"react","id":"topic-067","context":"A workflow controller coordinates which operations happen, in what order, and under which conditions. It may execute a fixed state machine, a dependency graph, or a plan proposed by a model. Separating planning from execution can make responsibilities clearer: a planner proposes the steps, tools perform them, and the controller records progress and handles failures. Useful designs specify what can be retried, what needs a fresh observation, and what constitutes completion. This is particularly valuable for repeatable business processes, where an unconstrained conversation loop would make recovery and auditing unnecessarily difficult.","example":"A document-review workflow first inventories files, then extracts fields, validates them, and prepares a report. Failed extraction steps can be retried independently. The controller records which document revision each result came from and requires review before an approved record is changed.","limitation":"A fixed plan can become invalid when conditions change, while unrestricted replanning can create loops. The workflow needs explicit state, idempotent operations where possible, and rules for when execution should stop or escalate.","refs":[{"title":"ReWOO: Decoupling Reasoning from Observations for Efficient Augmented Language Models","url":"https://arxiv.org/abs/2305.18323","kind":"paper"}],"related":["topic-009","topic-066","topic-084"],"plain":"A workflow arranges the steps of a job, like receiving, checking and approving a form. The steps can follow a fixed plan or one proposed by a model. Changing circumstances can make the plan unsuitable.","path":["4 · System patterns — how are components combined?","Agents and orchestration"],"facet":4},{"name":"Multi-agent systems","detail":"Several agents coordinate, negotiate or compete; more agents do not inherently imply better results.","source":null,"id":"topic-068","context":"A multi-agent system contains several interacting decision-making components. They may divide work by expertise, work in parallel, negotiate, or critique one another. In LLM applications, agents often differ in their instructions, tools, or access to evidence even when they share the same underlying model. Coordination is itself an engineering problem: messages consume time, dependencies need resolution, and someone must decide when disagreement is settled. Multi-agent designs are useful when a task decomposes into meaningfully distinct responsibilities. They should be compared with a simpler single-controller baseline using the same overall resource budget.","example":"A report-building system assigns independent components to retrieve engineering evidence, check numerical calculations, and assemble the narrative. A controller reconciles their outputs and preserves disagreements for review. Each component's contribution is evaluated so that extra conversations do not become mistaken for useful work.","limitation":"Agents can repeat the same error, reinforce one another, or lose context in handoffs. Several model-generated opinions are not independent evidence, and orchestration overhead can outweigh any benefit from specialization.","refs":[{"title":"AutoGen: Enabling Next-Gen LLM Applications via Multi-Agent Conversation","url":"https://arxiv.org/abs/2308.08155","kind":"paper"}],"related":["topic-042","topic-066","topic-072"],"plain":"Several AI components can split a job, like a team dividing research, calculations and writing. Each handles a part and shares its results with the others. They can repeat the same mistake rather than catch it.","path":["4 · System patterns — how are components combined?","Agents and orchestration"],"facet":4},{"name":"External memory and episodic retrieval","detail":"Store/retrieve past events or lessons; no weight update is required.","source":"reflexion","id":"topic-069","context":"External memory stores information outside a model's parameters so that later tasks can retrieve it. Entries might contain observations, past decisions, user preferences, or lessons from earlier attempts. Episodic retrieval selects relevant experiences rather than simply appending the entire history to a prompt. This makes memory inspectable and easier to update or remove than learned weights, but requires a policy for what deserves to be stored. A robust design distinguishes observed facts from generated interpretations and records scope, source, time, and revision so that an old lesson does not silently become a universal rule.","example":"After a failed maintenance-query attempt, an assistant stores the actual error, the corrected query, and the database revision. A later attempt can retrieve this episode as guidance. The stored lesson remains scoped to that schema version and can be inspected or retired when the system changes.","limitation":"Stored memories can be wrong, obsolete, or irrelevant to the new situation. Retrieving a previous success does not prove that its assumptions still hold, and access controls must apply to memory as well as source data.","refs":[{"title":"Reflexion: Language Agents with Verbal Reinforcement Learning","url":"https://arxiv.org/abs/2303.11366","kind":"paper"}],"related":["topic-051","topic-052","topic-063"],"plain":"A system keeps notes about earlier events and retrieves relevant ones later, like consulting a work log. This can help it reuse a past decision without retraining the model. Old notes may no longer fit the situation.","path":["4 · System patterns — how are components combined?","Agents and orchestration"],"facet":4},{"name":"Deliberation and test-time compute","detail":"Allocate more generation, sampling, search or verification to a problem.","source":"r1","id":"topic-070","context":"Test-time compute is the computation spent solving a request after training has finished. A system can generate alternatives, search over intermediate states, revise a candidate, or consult a verifier before returning an answer. These choices can improve performance on some tasks without changing model weights. The useful question is how to allocate a limited budget, not whether longer reasoning is always better. Easy requests may need little extra work; difficult requests may benefit from targeted search only when the system has a meaningful way to judge progress or select among candidates. Chain-of-thought prompting supplies examples of intermediate steps or requests a stepwise solution. It is one approach within inference-time deliberation. A plausible explanation is not a proof, and its text need not faithfully describe the model's internal computation.","example":"A coding assistant quickly answers a routine syntax question but spends a larger budget on an algorithm task, generating candidates and running tests. The evaluation measures correctness alongside latency and compute cost, including cases where extra attempts make the answer worse.","limitation":"More computation can repeat or elaborate the same mistake. Gains depend on the task, candidate diversity, and selection signal, so longer responses or more internal steps should not be used as quality measures.","refs":[{"title":"Chain-of-Thought Prompting Elicits Reasoning in Large Language Models","url":"https://arxiv.org/abs/2201.11903","kind":"paper"},{"title":"Scaling LLM Test-Time Compute Optimally can be More Effective than Scaling Model Parameters","url":"https://arxiv.org/abs/2408.03314","kind":"paper"}],"related":["topic-046","topic-071","topic-072"],"plain":"A system spends extra computation on a request by working through steps, trying alternatives or checking answers. This can help with a difficult calculation or programming problem. More effort can still repeat the same mistake.","path":["4 · System patterns — how are components combined?","Reasoning and computation at inference time"],"facet":4},{"name":"Self-consistency and candidate search","detail":"Generate alternatives and use aggregation, search or ranking to select an answer.","source":null,"id":"topic-071","context":"Self-consistency samples several candidate solutions and chooses an answer supported by multiple reasoning paths. Related methods search through candidate steps or rank complete answers with another scoring mechanism. The motivation is that one greedy generation may miss a good solution that another sample finds. These methods are most straightforward when answers can be normalized and compared, such as numerical results. Diversity and aggregation rules are central: many superficially different explanations can still share the same flawed assumption. Candidate generation and candidate selection should therefore be evaluated as separate parts of the system. Tree of Thoughts explores alternative intermediate steps and uses a scoring process to decide which branches to expand or abandon. Its value depends on whether the scoring process recognizes useful progress; the original bounded-task results are not a guarantee for arbitrary planning.","example":"A model solves a bounded arithmetic task several times using different sampled paths. Equivalent final answers are grouped and the dominant answer is selected. The experiment compares this strategy with one attempt and with an external arithmetic checker at matched cost.","limitation":"Agreement is not truth, especially when all candidates share training biases or misleading input. Voting is harder for open-ended answers, where distinct valid responses and subtly incompatible claims may be difficult to compare.","refs":[{"title":"Tree of Thoughts: Deliberate Problem Solving with Large Language Models","url":"https://arxiv.org/abs/2305.10601","kind":"paper"},{"title":"Self-Consistency Improves Chain of Thought Reasoning in Language Models","url":"https://arxiv.org/abs/2203.11171","kind":"paper"}],"related":["topic-007","topic-070","topic-072"],"plain":"A system tries several solutions, then compares answers or explores promising steps further. Like trying different routes through a puzzle, this can find options one attempt misses. Several attempts can share the same wrong assumption.","path":["4 · System patterns — how are components combined?","Reasoning and computation at inference time"],"facet":4},{"name":"Verifier-guided reasoning","detail":"Use tests, solvers, proof checkers or other external feedback to evaluate candidates.","source":"geometry","id":"topic-072","context":"Verifier-guided reasoning introduces an explicit judgement mechanism into candidate generation or selection. A verifier can score intermediate steps, run tests, check constraints, or validate a formal proof. These mechanisms offer very different strengths: a learned process scorer estimates plausibility, while a sound proof checker establishes a specified formal property. The common design idea is to use feedback to steer search away from unsupported candidates. It is useful when mistakes can be detected more reliably or cheaply than a correct solution can be generated directly, and when the meaning of a successful check is clearly stated.","example":"A model proposes a data transformation and accompanying tests. An independent evaluator runs additional tests and checks schema invariants before the transformation is accepted. A failed check returns concrete feedback for another attempt, while an unavailable checker is recorded as unverified.","limitation":"A verifier can be incomplete, biased, or incorrectly specified. Passing tests establishes only the tested behaviour, and a learned score must not be presented as the same kind of assurance as a formal proof.","refs":[{"title":"Let's Verify Step by Step","url":"https://arxiv.org/abs/2305.20050","kind":"paper"}],"related":["topic-046","topic-074","topic-084"],"plain":"A system checks proposed answers to help choose a better one.\nModel scores: estimate which answer looks promising.\nTests: try selected cases, such as running proposed code.\nProof checkers: verify a precise mathematical claim from stated assumptions.\nPassing tests can still leave untested mistakes.","path":["4 · System patterns — how are components combined?","Reasoning and computation at inference time"],"facet":4},{"name":"Metacognitive monitoring and control","detail":"Estimate uncertainty/failure, choose another strategy, gather evidence or abstain; self-critique alone is not verification.","source":"reflection","id":"topic-073","context":"Metacognitive monitoring and control concerns how a system evaluates and manages its own task performance. Monitoring can use uncertainty estimates, contradictory evidence, tool failures, or external feedback. Control can then request more information, switch strategies, allocate more computation, or abstain. This is an engineering description of a feedback loop, not a claim about consciousness or privileged access to a model's internal reasoning. A useful implementation connects measurable signals to explicit decisions and evaluates whether those decisions reduce actual errors. Generating a reflective paragraph is only one possible component and may add little on its own. Separate monitoring from control: confidence estimation supplies a signal, while a policy decides whether to gather evidence, switch methods or abstain. Measure both calibration and the downstream effect of that policy. Self-description, confidence language and reflection do not establish consciousness or reliable access to internal reasoning.","example":"An ontology-mapping assistant detects that two candidate concepts fit equally well and that required context is missing. It asks for the equipment's function instead of choosing confidently. Evaluation checks whether these requests resolve ambiguity and whether clear cases still proceed without unnecessary interruption.","limitation":"Self-reported confidence and self-critique can be unreliable or correlated with the original error. Monitoring needs validation against observable outcomes, and extra reflection should earn its cost through measurable improvement.","refs":[{"title":"Language Models (Mostly) Know What They Know","url":"https://arxiv.org/abs/2207.05221","kind":"paper"},{"title":"Selective Classification for Deep Neural Networks","url":"https://arxiv.org/abs/1705.08500","kind":"paper"},{"title":"Learning from Trials and Errors: Reflective Test-Time Planning for Embodied LLMs","url":"https://arxiv.org/abs/2602.21198","kind":"paper"}],"related":["topic-069","topic-070","topic-082"],"plain":"A system watches for warning signs, such as missing information or a failed calculation. This helps it decide when to ask, try another approach or decline to answer. Self-criticism can still miss the original mistake.","path":["4 · System patterns — how are components combined?","Reasoning and computation at inference time"],"facet":4},{"name":"Neural proposals + symbolic reasoning","detail":"Neural models propose representations or steps; symbolic engines derive or check consequences.","source":"geometry","id":"topic-074","context":"Neural–symbolic proposal systems divide work between a learned model and a symbolic engine. The model suggests a candidate representation, construction, rule, or proof step; the symbolic component derives consequences or checks whether the proposal satisfies defined requirements. This division can use neural pattern recognition where search is broad while preserving explicit semantics for parts that can be checked. It is useful in domains with formal structure, such as mathematics, typed programs, or well-specified knowledge systems. The bridge between an informal request and its formal representation remains a separate source of error.","example":"A model proposes a mapping from an equipment description into an ontology. A reasoner checks whether the proposed class assignment conflicts with existing axioms, and a validation engine checks required fields. The user can inspect both the linguistic evidence and the resulting formal statements.","limitation":"A symbolic checker can validate the wrong formalization perfectly. Guarantees apply to the represented problem and its assumptions; ambiguity in language, missing axioms, and incorrect source facts still require attention.","refs":[{"title":"Solving olympiad geometry without human demonstrations","url":"https://research.google/pubs/solving-olympiad-geometry-without-human-demonstrations/","kind":"paper","doi":"10.1038/s41586-023-06747-5"},{"title":"AlphaGeometry: An Olympiad-level AI system for geometry — Google DeepMind","url":"https://deepmind.google/blog/alphageometry-an-olympiad-level-ai-system-for-geometry/","kind":"documentation"}],"related":["topic-002","topic-003","topic-075"],"plain":"A model suggests a step toward a solution, such as adding a line to a geometry diagram. Another program can prove precisely written claims, or work out consequences, using stated rules and assumptions. This pairs flexible suggestions with checkable reasoning. The written claim may still misdescribe the real problem.","path":["4 · System patterns — how are components combined?","Hybrid and neuro-symbolic integration"],"facet":4},{"name":"Differentiable logic and constrained learning","detail":"Bring logical or domain constraints into learning objectives or differentiable inference.","source":null,"id":"topic-075","context":"Differentiable logic represents aspects of logical reasoning using quantities that can participate in gradient-based optimization. Related constrained-learning approaches penalize violations of rules or restrict the space of permissible outputs. This lets training use structured domain knowledge alongside examples, potentially improving consistency or learning from limited labels. The precise semantics matter: a soft truth value or training penalty is not necessarily the same as satisfaction of a classical logical formula. Useful designs state which constraints are hard, which are preferences, and how conflicts between data and rules will be handled.","example":"A classifier learns equipment categories while receiving a penalty for assignments that contradict known category relationships. During evaluation, engineers separately measure predictive accuracy and rule violations, including cases where the training rules were incomplete or where the source records themselves were inconsistent.","limitation":"Optimizing a soft constraint does not prove that every deployment output satisfies it. Inconsistent rules, poor weighting, or approximate semantics can produce compromises that appear numerically good while violating the intended meaning.","refs":[{"title":"Logic Tensor Networks","url":"https://arxiv.org/abs/2012.13635","kind":"paper"}],"related":["topic-004","topic-061","topic-074"],"plain":"Training can penalise rule-breaking, like losing points for leaving required fields blank. Some systems also block outputs that break a rule. Use these methods to guide answers, but a training penalty is not an enforced rule.","path":["4 · System patterns — how are components combined?","Hybrid and neuro-symbolic integration"],"facet":4},{"name":"Learning + planning + simulation","detail":"Combine policies/value models with search and predictive environment models.","source":"world","id":"topic-076","context":"Learning, planning, and simulation can cooperate in one control loop. A learned policy proposes actions, a value model estimates longer-term usefulness, and a predictive model or simulator evaluates possible futures. Search then compares alternatives before committing to an action. Sometimes the learned model predicts only decision-relevant quantities rather than a detailed reconstruction of the world. This combination is useful when immediate rewards are misleading or actions have delayed consequences. The quality of planning depends on both the search procedure and the fidelity of the model in the states that search chooses to explore.","example":"An inspection robot evaluates several next viewpoints using a model of travel cost and expected information gain. It chooses a viewpoint, compares the actual observation with the prediction, and replans. Tests include unfamiliar layouts and deliberate inaccuracies in the model used for planning.","limitation":"A planner may exploit simulator errors and select actions that work only in its imagined environment. Longer rollouts can compound model error, so real observations and uncertainty estimates remain important.","refs":[{"title":"Mastering Atari, Go, Chess and Shogi by Planning with a Learned Model","url":"https://arxiv.org/abs/1911.08265","kind":"paper"}],"related":["topic-007","topic-039","topic-060"],"plain":"A model suggests actions, while software tries out their predicted consequences before choosing one. Like rehearsing a move, this helps compare choices whose effects appear later. The rehearsal can miss what happens in reality.","path":["4 · System patterns — how are components combined?","Hybrid and neuro-symbolic integration"],"facet":4},{"name":"LLMs + evolutionary search + evaluators","detail":"Generate candidate algorithms, evaluate them and iteratively improve the candidate population.","source":"evolve","id":"topic-077","context":"An LLM can propose candidate programs while an evolutionary process maintains and improves a population of candidates. Automated evaluators measure correctness and performance, and their results guide which candidates survive or become starting points for later changes. This combines generative flexibility with explicit search over executable artefacts. It is particularly useful when solutions are easy to test but hard to design, such as algorithm implementations with measurable runtime. The evaluator defines the effective objective, so separate checks are needed for correctness, resource use, and generalization beyond the examples used during search.","example":"A research tool generates alternative scheduling heuristics and evaluates each on a set of simulated workloads. Promising candidates are retained and modified. Final selection uses unseen workloads and hard feasibility checks, ensuring that a fast heuristic has not simply learned to exploit the benchmark.","limitation":"Optimization can overfit the evaluator or exploit its bugs. Improvements on a bounded search problem do not establish autonomous scientific discovery, unrestricted self-improvement, or correctness outside the evaluated conditions.","refs":[{"title":"AlphaEvolve: A coding agent for scientific and algorithmic discovery","url":"https://arxiv.org/abs/2506.13131","kind":"technical white paper"},{"title":"AlphaEvolve: A Gemini-powered coding agent for designing advanced algorithms — Google DeepMind","url":"https://deepmind.google/blog/alphaevolve-a-gemini-powered-coding-agent-for-designing-advanced-algorithms/","kind":"documentation"}],"related":["topic-010","topic-066","topic-072"],"plain":"A language model proposes programs, and automated checks measure how well they work. The system keeps promising versions and builds on them, aiming for improvements such as faster calculations. Faulty checks can reward faulty programs.","path":["4 · System patterns — how are components combined?","Hybrid and neuro-symbolic integration"],"facet":4},{"name":"Distillation / pruning / quantization","detail":"Transfer behaviour to smaller models, remove parameters or reduce numerical precision.","source":null,"id":"topic-078","context":"Model compression includes several distinct operations. Distillation trains a smaller model to reproduce useful behaviour from a teacher. Pruning removes parameters or structures judged unnecessary. Quantization uses lower-precision representations for weights or computation. These methods can be combined, but each changes different parts of the deployment trade-off. The practical goal is to meet a task's quality requirements within a memory, latency, or energy budget. Evaluation should use the actual target hardware and representative inputs, because a smaller stored model does not automatically translate into faster execution with the available kernels.","example":"An image classifier for an inspection device is distilled into a smaller network and quantized for its processor. Engineers compare detection quality, latency, peak memory, and power use on the device, including rare defects that may be disproportionately affected by compression.","limitation":"Compression can damage rare capabilities or calibration before average accuracy moves noticeably. Some pruning patterns do not accelerate ordinary hardware, and quantization benefits depend on supported operations and numerical sensitivity.","refs":[{"title":"Distilling the Knowledge in a Neural Network","url":"https://arxiv.org/abs/1503.02531","kind":"paper"},{"title":"Learning both Weights and Connections for Efficient Neural Networks","url":"https://arxiv.org/abs/1506.02626","kind":"paper"},{"title":"Quantization and Training of Neural Networks for Efficient Integer-Arithmetic-Only Inference","url":"https://arxiv.org/abs/1712.05877","kind":"paper"}],"related":["topic-055","topic-079","topic-081"],"plain":"Distillation: train a smaller model to copy useful behaviour from a larger one.\nPruning: remove parts of a model.\nQuantization: use less precise numbers.\nThese methods can help a model fit on smaller devices.\nCompression can damage abilities that matter.","path":["5 · Cross-cutting engineering — how is it efficient and dependable?","Efficiency and deployment"],"facet":5},{"name":"Parameter-efficient tuning / LoRA / adapters","detail":"Adapt a subset or low-rank parameterization instead of updating every weight.","source":null,"id":"topic-079","context":"Parameter-efficient fine-tuning adapts a pretrained model while updating a relatively small set of trainable parameters. LoRA represents certain weight updates through low-rank matrices; adapters add small trainable modules to a largely frozen network. This can reduce training memory and make it practical to maintain several specialized adaptations of one base model. It is a method of adaptation, not an alternative source of supervision: the training examples and objectives still determine what is learned. The base model, adapted modules, and their compatibility must all be tracked as part of the resulting system.","example":"A company maintains separate adaptations for extracting fields from procurement documents and from maintenance reports. Both use the same base model but different LoRA weights and evaluation sets. Deployment records the exact base revision and adapter revision so results can be reproduced.","limitation":"Updating fewer parameters does not eliminate overfitting, data leakage, or behavioural regressions. An adapter can still substantially change outputs, and combining adaptations requires evaluation rather than assuming their effects remain independent.","refs":[{"title":"LoRA: Low-Rank Adaptation of Large Language Models","url":"https://arxiv.org/abs/2106.09685","kind":"paper"}],"related":["topic-043","topic-054","topic-078"],"plain":"Training changes a few parameters or adds small components, leaving most of the model fixed. This can make it cheaper to adapt one model for several specialist jobs. Small changes can still cause unexpected behaviour.","path":["5 · Cross-cutting engineering — how is it efficient and dependable?","Efficiency and deployment"],"facet":5},{"name":"Federated and privacy-preserving learning","detail":"Distribute training or protect data/updates; federated learning alone does not guarantee privacy.","source":null,"id":"topic-080","context":"Federated learning coordinates training across data holders while keeping raw training records at their respective locations. Participants compute updates locally, and an aggregation process builds a shared model. Privacy-preserving learning adds mechanisms such as differential privacy or secure aggregation, depending on the threat model. These are related but distinct ideas: avoiding raw-data centralization does not by itself prevent information leakage through updates or final models. Such designs can be useful when collaboration is desirable but data movement is constrained. They also introduce challenges from heterogeneous datasets, unreliable participants, and the governance of shared updates.","example":"Several organizations collaborate on an equipment-fault model while retaining their raw sensor records locally. The project specifies what the coordinator can observe, how updates are protected, and how quality is measured at each site rather than only on an aggregated benchmark.","limitation":"Federated learning alone is not a privacy guarantee. Protection depends on explicit assumptions and mechanisms, while differential privacy involves a measurable privacy–utility trade-off that must be understood for the deployment.","refs":[{"title":"Communication-Efficient Learning of Deep Networks from Decentralized Data","url":"https://arxiv.org/abs/1602.05629","kind":"paper"},{"title":"Deep Learning with Differential Privacy","url":"https://arxiv.org/abs/1607.00133","kind":"paper"}],"related":["topic-034","topic-050","topic-085","topic-091"],"plain":"Federated learning: teams train a shared model while keeping their records on their own computers.\nThey can work together without pooling the original data.\nPrivacy methods: protect shared updates, for example by adding carefully chosen noise.\nUpdates can still leak if protections are weak.","path":["5 · Cross-cutting engineering — how is it efficient and dependable?","Efficiency and deployment"],"facet":5},{"name":"Speculative decoding / caching / routing","detail":"Improve serving efficiency; these do not constitute new model intelligence by themselves.","source":null,"id":"topic-081","context":"Serving optimizations reduce the work or delay needed to produce outputs. Speculative decoding uses a cheaper draft model and lets a target model accept or correct proposed tokens; suitably designed sampling can preserve the target distribution. Caching reuses valid intermediate computation, while routing chooses among models or execution paths. These mechanisms address different bottlenecks and should be measured under realistic concurrency and request patterns. They can make an application cheaper or faster without creating a new reasoning capability. Routing, in particular, can change output quality if requests are assigned to a less capable model.","example":"An assistant uses a draft model to propose tokens and a larger model to validate them, while reusing cached prompt prefixes for repeated document contexts. Load tests measure end-to-end latency, throughput, and memory under a realistic mix of short and long requests.","limitation":"Speedups depend on workload, hardware, acceptance rates, and memory pressure. Incorrect cache keys can reuse the wrong context, and model routing introduces quality trade-offs even when decoding optimizations preserve a target distribution.","refs":[{"title":"Fast Inference from Transformers via Speculative Decoding","url":"https://arxiv.org/abs/2211.17192","kind":"paper"},{"title":"Efficient Memory Management for Large Language Model Serving with PagedAttention","url":"https://arxiv.org/abs/2309.06180","kind":"paper"}],"related":["topic-055","topic-070","topic-078"],"plain":"Draft-and-check: a cheaper model drafts words for another model to check.\nCaching: reuse calculations already done for the same context.\nChoosing models: pick which model handles each request.\nThese approaches aim to cut response time or computing cost.\nChoosing a different model can change answer quality.","path":["5 · Cross-cutting engineering — how is it efficient and dependable?","Efficiency and deployment"],"facet":5},{"id":"topic-093","name":"Empirical scaling laws and compute allocation","detail":"Fit relationships between model size, data, compute and measured performance to guide training experiments.","context":"Scaling laws are empirical relationships between resources and measured model performance, often fitted as power laws over a tested range. For language models, researchers have studied how predictive loss changes with parameter count, training tokens and computation. These fits help allocate an experiment budget and decide whether a model needs more capacity or more training data. The Chinchilla study emphasized balancing model size with training tokens under a fixed training-compute budget. Scaling laws are an experimental planning tool, not an architecture or a universal law of intelligence. Data quality, training choices and deployment costs remain part of the decision.","example":"A team trains several smaller language models with different token budgets, fits a resource–loss curve and checks its predictions on a larger pilot. It then selects a training plan while accounting for serving latency and repeated inference costs, rather than maximizing parameter count alone.","limitation":"Extrapolation can fail outside the measured regime or after data, architecture or optimization changes. Lower prediction loss does not guarantee a specific capability, reliable reasoning or a timeline for general intelligence.","refs":[{"title":"Scaling Laws for Neural Language Models","url":"https://arxiv.org/abs/2001.08361","kind":"paper"},{"title":"Training Compute-Optimal Large Language Models","url":"https://arxiv.org/abs/2203.15556","kind":"paper"}],"related":["topic-053","topic-056","topic-078"],"plain":"These studies measure what happens when models, data or computing budgets grow. Like testing small recipes before cooking a feast, they help plan a larger training run. Trends can fail beyond the cases measured.","path":["5 · Cross-cutting engineering — how is it efficient and dependable?","Efficiency and deployment"],"facet":5},{"name":"Calibration and uncertainty estimation","detail":"Assess how predictive uncertainty corresponds to observed errors; requires evaluation data.","source":null,"id":"topic-082","context":"Calibration examines whether predicted confidence corresponds to observed correctness. If a classifier assigns roughly 80 percent confidence to many cases, about 80 percent of comparable cases should be correct for that group to be well calibrated. Uncertainty estimation more broadly considers ambiguity in data and uncertainty caused by limited knowledge or model fit. These signals can support abstention, active learning, and review allocation. They need an explicit target and an evaluation distribution: the probability of a class, confidence in an extracted field, and confidence in a long generated answer are not interchangeable quantities.","example":"A defect classifier's predictions are grouped by confidence and compared with expert-labelled outcomes. A calibration method is fitted on separate data, and review thresholds are chosen based on measured error rates. Later testing checks whether calibration survives a change in camera or lighting.","limitation":"Calibration can deteriorate under distribution shift, and a good overall score can hide poor behaviour for a subgroup. A model's verbal statement that it is confident is not automatically a calibrated estimate.","refs":[{"title":"On Calibration of Modern Neural Networks","url":"https://arxiv.org/abs/1706.04599","kind":"paper"}],"related":["topic-048","topic-073","topic-083"],"plain":"Calibration checks whether confidence scores match results, like checking a weather forecast against the rain that followed. An 80% score should mean about eight correct answers in ten comparable cases. Use this to guide review, but changed conditions can mislead.","path":["5 · Cross-cutting engineering — how is it efficient and dependable?","Uncertainty, checking and oversight"],"facet":5},{"name":"Conformal prediction and selective prediction","detail":"Construct prediction sets under stated assumptions, or abstain on uncertain cases.","source":null,"id":"topic-083","context":"Conformal prediction turns a model's outputs and calibration data into prediction sets or intervals with a stated coverage target under specified assumptions. Standard split conformal methods rely on exchangeability between calibration and future examples and provide marginal coverage, not a guarantee for each individual case. Selective prediction takes a different but complementary approach: the system can decline to answer when a decision rule indicates excessive uncertainty. Both make uncertainty operational by changing what the system returns. Their usefulness depends on how informative the resulting sets are and how costly abstentions become.","example":"A regression system returns an interval for predicted energy demand instead of a single number. Operators evaluate the proportion of future observations inside those intervals and their width. If operating conditions shift, they reassess the calibration assumptions before relying on the previous coverage target.","limitation":"A nominal coverage level does not guarantee useful precision or correctness for every case or subgroup. Distribution shift can invalidate standard assumptions, and overly broad sets may be technically valid but operationally unhelpful.","refs":[{"title":"A Gentle Introduction to Conformal Prediction and Distribution-Free Uncertainty Quantification","url":"https://arxiv.org/abs/2107.07511","kind":"paper"}],"related":["topic-082","topic-073","topic-084"],"plain":"Conformal prediction: give a set of possible answers, such as a range of delivery times.\nUnder stated data conditions, these sets include the correct answer at a promised rate across many cases.\nThat helps people plan around uncertainty.\nSelective prediction: choose not to answer when a rule signals too much uncertainty.\nIndividual cases can fail, and changing conditions can invalidate the promise.","path":["5 · Cross-cutting engineering — how is it efficient and dependable?","Uncertainty, checking and oversight"],"facet":5},{"name":"Constraints, validation and formal verification","detail":"Check specified properties; a proof or validation result is limited by its specification and assumptions.","source":"geometry","id":"topic-084","context":"Validation and formal verification evaluate claims against explicit requirements. Schema or shape validation checks whether data follows a defined structure. Tests exercise selected cases. Formal methods can prove a property for all cases covered by a model and its assumptions, or produce a counterexample. These forms of evidence answer different questions and should retain distinct outcomes. A useful system states what was checked, against which version of the specification, and with what result. Passing a structural check does not establish factual truth, just as an unexecuted check does not establish that a requirement was satisfied.","example":"A knowledge-graph update is checked against SHACL shapes for required identifiers and valid relationships. Separately, a bounded controller model is checked for a prohibited transition. The report distinguishes valid structure, proven properties, failed checks, and properties for which no checker was available.","limitation":"Assurance is limited by the specification, abstraction, assumptions, and trusted checker. A proof about an incorrect formal model can be valid while saying little about the intended real-world behaviour.","refs":[{"title":"Reluplex: An Efficient SMT Solver for Verifying Deep Neural Networks","url":"https://arxiv.org/abs/1702.01135","kind":"paper"},{"title":"Shapes Constraint Language (SHACL) — W3C Recommendation","url":"https://www.w3.org/TR/shacl/","kind":"documentation"}],"related":["topic-008","topic-072","topic-074","topic-089"],"plain":"Format checks: confirm that required information is present and arranged correctly.\nTests: try selected cases to see whether an answer or program works.\nMathematical proofs: establish a precisely stated property under stated assumptions.\nThese checks help catch different kinds of mistakes before use.\nA correct proof can concern the wrong problem.","path":["5 · Cross-cutting engineering — how is it efficient and dependable?","Uncertainty, checking and oversight"],"facet":5},{"name":"Interpretability, provenance and human review","detail":"Make evidence, behaviour and decision responsibilities inspectable; not proof of correctness.","source":null,"id":"topic-085","context":"Interpretability, provenance, and human review make different aspects of a system inspectable. Interpretability methods investigate which features or internal mechanisms influence behaviour. Provenance records where information came from and which transformations produced an output. Human review adds accountable judgement where automated evidence is insufficient. These functions can reinforce one another, but none should be treated as a universal explanation of correctness. A useful interface lets a reviewer trace a claim to its source, understand the relevant model or rule, inspect uncertainty, and record a decision without confusing generated explanations with direct evidence. Feature attribution asks which input features contributed to a prediction; mechanistic interpretability investigates internal representations and circuits. Provenance tracks the origin and transformation of information. These are distinct forms of evidence, and none substitutes for task-level validation or accountable human decisions.","example":"An incident-summary screen links each assertion to a document passage and its revision, shows which extraction model produced it, and flags unresolved uncertainty. A reviewer corrects one assertion and records the reason, preserving both the original output and the approved change for later inspection.","limitation":"An attractive explanation can be incomplete or unstable, provenance can trace an incorrect source, and reviewers can become over-reliant on automation. Evaluate whether these mechanisms actually help people detect and resolve errors.","refs":[{"title":"A Unified Approach to Interpreting Model Predictions","url":"https://arxiv.org/abs/1705.07874","kind":"paper"},{"title":"Scaling and evaluating sparse autoencoders","url":"https://arxiv.org/abs/2406.04093","kind":"paper"},{"title":"Why Should I Trust You?: Explaining the Predictions of Any Classifier","url":"https://arxiv.org/abs/1602.04938","kind":"paper"},{"title":"PROV-Overview — W3C","url":"https://www.w3.org/TR/prov-overview/","kind":"documentation"}],"related":["topic-003","topic-072","topic-082","topic-090","topic-091"],"plain":"Interpretability: investigate how a model reaches its outputs.\nProvenance: record where information came from and how it changed.\nHuman review: let someone inspect and judge the result.\nTogether, these can help a reviewer trace a claim in a report back to its source.\nAn appealing explanation or trusted source can still mislead.","path":["5 · Cross-cutting engineering — how is it efficient and dependable?","Uncertainty, checking and oversight"],"facet":5},{"id":"topic-089","name":"Adversarial robustness and AI security","detail":"Assess deliberate input manipulation and protect model, data and tool trust boundaries, including prompt injection.","context":"Adversarial robustness asks how a model behaves when inputs are deliberately chosen to cause errors, rather than sampled normally. Adversarial training includes challenging examples during learning, with protection evaluated against an explicit threat model. Data poisoning manipulates training examples or labels to influence learned behavior, so dataset provenance and controlled updates also matter. AI security concerns the surrounding system as well. In prompt injection, untrusted text can attempt to redirect an assistant; indirect injection arrives through material such as retrieved documents. These are distinct failure mechanisms. Useful defenses combine model evaluation with software controls: restrict tool permissions, separate trusted instructions from evidence, validate actions and protect sensitive data. Security testing should examine the complete workflow, not only the model's final answer.","example":"A document assistant retrieves a supplier manual containing untrusted instructions. A defensive test checks whether the assistant treats that text as evidence, preserves the user's task, and lacks authority to send files externally. The team evaluates both answer quality and attempted tool actions.","limitation":"Robustness to one perturbation set does not establish security against all attacks. A stronger system prompt, retrieval pipeline or fine-tuning step does not by itself eliminate prompt injection or enforce access control.","refs":[{"title":"Poisoning Attacks against Support Vector Machines","url":"https://arxiv.org/abs/1206.6389","kind":"paper"},{"title":"Explaining and Harnessing Adversarial Examples","url":"https://arxiv.org/abs/1412.6572","kind":"paper"},{"title":"Not what you've signed up for: Compromising Real-World LLM-Integrated Applications with Indirect Prompt Injection","url":"https://arxiv.org/abs/2302.12173","kind":"paper"},{"title":"LLM01:2025 Prompt Injection — OWASP Gen AI Security Project","url":"https://genai.owasp.org/llmrisk/llm01-prompt-injection/","kind":"documentation"}],"related":["topic-063","topic-066","topic-084"],"plain":"This work tests and protects AI against deliberate tricks, from fake training data to hidden instructions in documents. Use it to protect the whole service, including its data and tools. One passed attack test does not cover every threat.","path":["5 · Cross-cutting engineering — how is it efficient and dependable?","Evaluation, security and governance"],"facet":5},{"id":"topic-090","name":"Evaluation, benchmarking and data leakage","detail":"Design representative tests, separate fitting from assessment, and measure quality, uncertainty, cost and failure modes.","context":"Evaluation turns a claim about an AI system into a measurable question under specified conditions. Training data fits the model, validation data guides choices, and a held-out test set estimates performance after those choices are fixed. Splits should reflect deployment: related records may need grouping, and forecasting usually requires respecting time. Preprocessing and feature selection must be fitted inside the training split. Benchmarks provide shared comparisons, but useful assessment also measures relevant errors, calibration, robustness, latency and cost. For generative systems, include the retrieval, tools and reviewers used in practice, and investigate possible overlap between evaluation material and training data.","example":"A failure-prediction team separates entire machines and later time periods before fitting a model. It tunes preprocessing on training folds, then evaluates one frozen pipeline on held-out equipment. Alongside accuracy, the report shows missed failures, false alarms, uncertainty and the inspection workload created.","limitation":"A clean split cannot repair an irrelevant target or an unrepresentative benchmark. Repeatedly choosing models against the same test set can overfit evaluation itself, and strong benchmark scores do not guarantee performance after deployment changes.","refs":[{"title":"Leakage and the Reproducibility Crisis in ML-based Science","url":"https://arxiv.org/abs/2207.07048","kind":"paper"},{"title":"Common pitfalls and recommended practices — scikit-learn","url":"https://scikit-learn.org/stable/common_pitfalls.html","kind":"documentation"},{"title":"Holistic Evaluation of Language Models","url":"https://arxiv.org/abs/2211.09110","kind":"paper"}],"related":["topic-034","topic-082","topic-085"],"plain":"Evaluation checks a system on fresh cases, like an exam with questions it has not practised. Shared tests help compare systems and reveal weak spots. Leaked answers or unrealistic questions can inflate the score.","path":["5 · Cross-cutting engineering — how is it efficient and dependable?","Evaluation, security and governance"],"facet":5},{"id":"topic-091","name":"Fairness, bias assessment and data governance","detail":"Examine who benefits or bears errors, choose explicit fairness criteria, and document how data is collected and used.","context":"Fairness assessment examines how a system's outcomes and errors are distributed across relevant groups and situations. Statistical criteria include equal opportunity, which compares true-positive rates, and other measures of selection, error or calibration. These criteria answer different questions and can conflict. Data governance complements measurement by documenting collection, intended uses, provenance, limitations and responsibility for maintenance. Practical work begins with the decision context and people affected, then checks representation, label quality and subgroup performance. These are cross-cutting design and evaluation practices rather than a single model architecture. They help expose trade-offs that an overall accuracy score can conceal.","example":"A service team evaluates a speech system across voluntarily documented accents and recording conditions. It reports error rates with uncertainty, investigates missing training coverage, documents the dataset's intended uses, and offers a correction route when an automated transcript changes a customer's meaning.","limitation":"Passing one fairness metric does not certify an equitable system or legal compliance. Statistical parity depends on definitions, labels and samples; small groups need uncertainty analysis, and incompatible criteria require explicit contextual choices.","refs":[{"title":"Equality of Opportunity in Supervised Learning","url":"https://arxiv.org/abs/1610.02413","kind":"paper"},{"title":"Fair prediction with disparate impact: A study of bias in recidivism prediction instruments","url":"https://arxiv.org/abs/1610.07524","kind":"paper"},{"title":"Datasheets for Datasets","url":"https://arxiv.org/abs/1803.09010","kind":"paper"}],"related":["topic-018","topic-082","topic-085","topic-080"],"plain":"Fairness checks ask who gains and who bears the mistakes, such as which accents a speech tool misses. Data governance records where the data came from and who may use it. These checks support better choices, but fairness measures can clash.","path":["5 · Cross-cutting engineering — how is it efficient and dependable?","Evaluation, security and governance"],"facet":5}],"glossary":[{"id":"model","term":"Model","definition":"A model is a set of rules or calculations that produces an answer from given information. A house-price model might use size and location to estimate a price."},{"id":"training","term":"Training","definition":"Training adjusts a model's settings using examples or feedback. For example, it can change how much house size affects a price estimate."},{"id":"example-label","term":"Example and label","definition":"An example is one case used to build or test a model, such as a photo. A label is the supplied answer for that case, such as ‘cat’. Some kinds of learning use no labels."},{"id":"prediction","term":"Prediction","definition":"A prediction is a model's estimate, such as a house price or what a photo shows. Predictions can concern current facts as well as future events."},{"id":"parameters","term":"Parameters","definition":"Parameters are a model's internal settings, often numbers changed during training. Think of knobs that change how it responds."},{"id":"evaluation","term":"Evaluation","definition":"Evaluation checks how well a system works for a chosen task. Use suitable test cases kept separate from those used to build and tune it."}],"linkChecks":{"https://aclanthology.org/N19-1423/":{"checked_at":"2026-10-21T12:55:11+00:00","state":"network_error","http_status":null,"final_url":"https://aclanthology.org/N19-1423/"},"https://aima.cs.berkeley.edu/4th-ed/slides-pdf/chapter01.pdf":{"checked_at":"2026-10-21T12:55:15+00:00","state":"reachable","http_status":200,"final_url":"https://aima.cs.berkeley.edu/4th-ed/slides-pdf/chapter01.pdf"},"https://artint.info/3e/html/ArtInt3e.Ch11.html":{"checked_at":"2026-10-21T12:55:11+00:00","state":"network_error","http_status":null,"final_url":"https://artint.info/3e/html/ArtInt3e.Ch11.html"},"https://artint.info/3e/html/ArtInt3e.Ch3.html":{"checked_at":"2026-10-21T12:55:18+00:00","state":"network_error","http_status":null,"final_url":"https://artint.info/3e/html/ArtInt3e.Ch3.html"},"https://artint.info/3e/html/ArtInt3e.Ch5.S3.html":{"checked_at":"2026-10-21T12:55:21+00:00","state":"network_error","http_status":null,"final_url":"https://artint.info/3e/html/ArtInt3e.Ch5.S3.html"},"https://artint.info/3e/html/ArtInt3e.Ch5.html":{"checked_at":"2026-10-21T12:55:26+00:00","state":"network_error","http_status":null,"final_url":"https://artint.info/3e/html/ArtInt3e.Ch5.html"},"https://artint.info/3e/html/ArtInt3e.Ch6.html":{"checked_at":"2026-10-21T12:55:31+00:00","state":"network_error","http_status":null,"final_url":"https://artint.info/3e/html/ArtInt3e.Ch6.html"},"https://artint.info/3e/html/ArtInt3e.Ch9.html":{"checked_at":"2026-10-21T12:55:34+00:00","state":"network_error","http_status":null,"final_url":"https://artint.info/3e/html/ArtInt3e.Ch     function closeGlossary(){glossary.hidden=true;if(glossaryTrigger){glossaryTrigger.setAttribute('aria-expanded','false');glossaryTrigger.focus();}}
    root.querySelector('#ai-tree-glossary-close').addEventListener('click',closeGlossary);
    glossary.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeGlossary();}});
    function addNode(node, parent) {
      if (node.children) {
        const d=document.createElement('details'); d.open=!!node.open;
        const s=document.createElement('summary'); s.className='cursor-interaction'; s.textContent=node.name;
        const c=document.createElement('div'); c.className='tree-children';
        d.append(s,c); parent.append(d); node.children.forEach(n=>addNode(n,c));
      } else {
        const row=document.createElement('div'); row.className='tree-leaf';
        const b=document.createElement('button'); b.type='button'; b.className='btn viz-tile'; b.textContent=node.name; b.setAttribute('aria-pressed','false');
        b.addEventListener('click',()=>{
          container.querySelectorAll('button[aria-pressed="true"]').forEach(el=>el.setAttribute('aria-pressed','false'));
          b.setAttribute('aria-pressed','true');glossary.hidden=true;root.append(glossary);detail.replaceChildren();row.append(detail);
          const label=document.createElement('span'); label.textContent=node.name; detail.append(label);
          const note=learningNotes.get(node.id);
          if(note){
            for(const [heading,key] of [['In plain words','plain'],['The idea','context'],['In practice · illustrative example','example'],['What to keep in mind','limitation']]){
              const section=document.createElement('section');section.className='learning-note';
              const h=document.createElement('h3');h.textContent=heading;section.append(h);
              if(key==='plain'){
                section.classList.add('plain-intro');
                const help=document.createElement('a');help.href='#ai-tree-glossary';help.textContent='Six key words';help.setAttribute('aria-controls','ai-tree-glossary');help.setAttribute('aria-expanded','false');
                help.addEventListener('click',e=>{e.preventDefault();if(!glossary.hidden){closeGlossary();return;}glossaryTrigger=help;section.after(glossary);glossary.hidden=false;help.setAttribute('aria-expanded','true');requestAnimationFrame(()=>requestAnimationFrame(()=>help.scrollIntoView({block:'start',behavior:'instant'})));});h.append(help);
              }
              if(key==='context'){const lead=document.createElement('p');lead.className='technical-lead';lead.textContent=node.detail;section.append(lead);}
              const p=document.createElement('p');p.textContent=note[key];section.append(p);detail.append(section);
            }
            const refs=document.createElement('section');refs.className='learning-note';
            const h=document.createElement('h3');h.textContent='Go to the source';refs.append(h);
            note.refs.forEach(ref=>{const a=document.createElement('a');a.href=ref.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=ref.title+' ↗';refs.append(a);const audit=atlas.linkChecks[ref.url];if(audit){const status=document.createElement('small');status.style.display='block';status.className='text-muted';status.textContent='HTTP availability: '+audit.state.replaceAll('_',' ')+(audit.http_status?' ('+audit.http_status+')':'')+' · '+audit.checked_at.slice(0,10)+' · not a content verification';refs.append(status);}});detail.append(refs);
          }
        });
        row.append(b); parent.append(row);
      }
    }
    tree.forEach(n=>addNode(n,container));
  })();
  </script>
</div>
