<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title><!--__TITLE__--></title>
<style>
:root{color-scheme:light;--border:#e4e6e8;--muted-foreground:#71767b;--viz-series-1:#2a91d2;font:14px/1.45 Arial,sans-serif;color:#303437;background:#fff}*{box-sizing:border-box}body{margin:0;padding:16px}h2{font-size:22px;font-weight:500;line-height:1.2;margin:0 0 5px}a{color:#286e9b}button,summary,a{touch-action:manipulation}button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid #2a91d2;outline-offset:3px}.btn{font:inherit;color:inherit;background:#fff;border:1px solid var(--border);border-radius:10px;padding:4px 10px;cursor:pointer;line-height:1.3}.viz-tile{width:100%;text-align:inherit}.btn:hover{background:#f7f9fa}.btn[aria-pressed=true]{border-color:#2a91d2;box-shadow:0 0 0 1px #2a91d2;background:#f6f9fb}.text-small{font-size:12px}.text-muted{color:var(--muted-foreground)}.card{padding:14px;border:1px solid var(--border);border-radius:12px;margin-top:12px}.viz-row{display:flex;gap:14px;flex-wrap:wrap}.cursor-interaction{cursor:pointer}p{overflow-wrap:anywhere}main{display:flow-root}@media(max-width:480px){body{padding:10px}h2{font-size:20px}}
